<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <title>투자 리서치 - 운영 대시보드</title>
  <style>
    :root{
      --bg:#f5f6f8; --card:#ffffff; --line:#e4e7ec;
      --ink:#14161c; --sub:#565d6b; --muted:#8b909c;
      --accent:#2f6feb; --accent-soft:#eef3fe;
      --v-watch:#8a6d1f; --v-watch-bg:#fbf3df;
      --v-buy:#1a7f43;   --v-buy-bg:#e7f4ec;
      --v-hold:#2f6feb;  --v-hold-bg:#eef3fe;
      --v-sell:#cf3b3b;  --v-sell-bg:#fdecec;
      --v-drop:#8b909c;  --v-drop-bg:#f1f2f4;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:"Pretendard",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
      font-size:15px; line-height:1.6; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; }
    .page{ max-width:1100px; margin:0 auto; padding:26px 24px 90px; padding-right:200px; }
    a.back{ display:inline-flex; margin-bottom:16px; color:var(--sub); text-decoration:none; font-size:14px; font-weight:600; }
    a.back:hover{ color:var(--accent); }
    button{ font-family:inherit; cursor:pointer; }

    header{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:16px; }
    h1{ margin:0; font-size:22px; font-weight:700; letter-spacing:-.3px; }
    header .sub{ margin:6px 0 0; color:var(--sub); font-size:13.5px; }
    .toolbar{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .btn{ border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:9px; padding:9px 14px; font-size:14px; font-weight:600; }
    .btn:hover{ border-color:#cdd2db; }
    .btn.primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
    .btn.primary:hover{ filter:brightness(.96); }
    .btn.sm{ padding:5px 9px; font-size:13px; border-radius:7px; }
    .btn.ghost{ border-color:transparent; background:transparent; color:var(--sub); }
    .btn.ghost:hover{ background:#eef0f4; color:var(--ink); }
    .btn.danger{ border-color:#f0caca; color:var(--v-sell); background:#fff; }
    .btn.danger:hover{ background:#fdecec; }

    /* 동기화 상태 */
    .sync{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--muted);
      border:1px solid var(--line); background:var(--card); border-radius:999px; padding:6px 12px; }
    .sync .dot{ width:8px; height:8px; border-radius:999px; background:#c3cad6; }
    .sync.on .dot{ background:var(--v-buy); } .sync.err .dot{ background:var(--v-sell); } .sync.busy .dot{ background:var(--v-watch); }

    /* 1층: 산업 탭 */
    .tabs{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:16px; }
    .tab{ border:1px solid var(--line); background:var(--card); border-radius:10px; padding:9px 15px; font-size:15px; font-weight:700; color:var(--sub); }
    .tab .c{ font-size:12px; font-weight:600; color:var(--muted); margin-left:6px; }
    .tab.on{ background:var(--ink); border-color:var(--ink); color:#fff; }
    .tab.on .c{ color:#c9ccd3; }
    .tab.add{ font-weight:600; color:var(--muted); border-style:dashed; }
    .tab.add:hover{ color:var(--accent); border-color:var(--accent); }

    /* 산업 헤더(매크로 근거) */
    .indhead{ background:var(--card); border:1px solid var(--line); border-left:3px solid var(--accent);
      border-radius:10px; padding:14px 18px; margin-bottom:18px; display:flex; align-items:flex-start; gap:12px; }
    .indhead .txt{ flex:1; }
    .indhead .why{ font-size:12px; font-weight:700; color:var(--accent); letter-spacing:.02em; }
    .indhead .macro{ margin-top:2px; }
    .indhead .macro.empty{ color:var(--muted); }
    .indhead .acts{ display:flex; gap:2px; opacity:.6; }
    .indhead:hover .acts{ opacity:1; }

    /* 요약 + 필터 */
    .bar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
    .sums{ display:flex; gap:8px; flex-wrap:wrap; }
    .sum{ background:var(--card); border:1px solid var(--line); border-radius:9px; padding:7px 12px; font-size:13px; font-weight:600; color:var(--sub); }
    .sum b{ color:var(--ink); font-weight:700; }
    .bar .sp{ flex:1; }
    .chip{ border:1px solid var(--line); background:var(--card); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:600; color:var(--sub); }
    .chip.on{ background:var(--ink); border-color:var(--ink); color:#fff; }
    select.sort{ border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px; font-weight:600; background:var(--card); color:var(--ink); font-family:inherit; }

    /* 2층: 단계 */
    .stage{ margin-bottom:22px; }
    .stage .sh{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
    .stage .sn{ font-size:16px; font-weight:700; }
    .stage .sc{ font-size:12.5px; color:var(--muted); font-weight:600; }
    .stage .stag{ font-size:11.5px; font-weight:700; color:var(--accent); background:var(--accent-soft); border-radius:6px; padding:2px 8px; }
    .stage .sa{ margin-left:auto; display:flex; gap:2px; opacity:.5; }
    .stage:hover .sa{ opacity:1; }
    .rack{ border:1px solid var(--line); border-radius:12px; background:var(--card); padding:14px; border-bottom:3px solid #dfe3ea; }
    .cards{ display:flex; gap:10px; flex-wrap:wrap; }
    /* 3층: 종목 카드 */
    .co{ position:relative; width:160px; border:1px solid var(--line); border-radius:10px; padding:12px 13px 12px 15px; background:#fff; text-align:left; overflow:hidden; }
    .co:hover{ border-color:#cdd2db; box-shadow:0 2px 8px rgba(20,22,28,.06); }
    .co::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--muted); }
    .co.v-매수::before{ background:var(--v-buy); } .co.v-보유::before{ background:var(--v-hold); }
    .co.v-관심::before{ background:var(--v-watch); } .co.v-매도::before{ background:var(--v-sell); } .co.v-제외::before{ background:var(--v-drop); }
    .co .tk{ font-size:15px; font-weight:700; }
    .co .nm{ font-size:12.5px; color:var(--muted); font-weight:500; margin-bottom:8px; }
    .co .vb{ display:inline-block; font-size:11.5px; font-weight:700; border-radius:6px; padding:2px 8px; }
    .co .mini{ font-size:11.5px; color:var(--sub); margin-top:7px; line-height:1.4; }
    .vb.v-매수{ color:var(--v-buy); background:var(--v-buy-bg); } .vb.v-보유{ color:var(--v-hold); background:var(--v-hold-bg); }
    .vb.v-관심{ color:var(--v-watch); background:var(--v-watch-bg); } .vb.v-매도{ color:var(--v-sell); background:var(--v-sell-bg); } .vb.v-제외{ color:var(--v-drop); background:var(--v-drop-bg); }
    .co.v-제외 .tk{ color:var(--muted); }
    .addco{ width:160px; min-height:96px; border:1px dashed #cdd2db; border-radius:10px; background:transparent; color:var(--muted); font-size:13px; font-weight:600; }
    .addco:hover{ border-color:var(--accent); color:var(--accent); }
    .emptys{ color:var(--muted); font-size:13px; }
    .foot{ margin-top:18px; color:var(--muted); font-size:12.5px; line-height:1.7; }

    /* 모달 */
    .overlay{ position:fixed; inset:0; background:rgba(20,22,28,.45); display:none; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow-y:auto; }
    .overlay.on{ display:flex; }
    .modal{ background:#fff; border-radius:14px; width:100%; max-width:540px; padding:22px 24px; }
    .modal h3{ margin:0 0 4px; font-size:18px; font-weight:700; }
    .modal .msub{ color:var(--muted); font-size:13px; margin:0 0 16px; }
    .frow{ display:flex; gap:12px; margin-bottom:12px; }
    .frow.trip > *{ flex:1; }
    .field{ flex:1; }
    .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--sub); margin-bottom:5px; }
    .field input, .field select, .field textarea{ width:100%; border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:14px; font-family:inherit; color:var(--ink); background:#fff; }
    .field textarea{ min-height:80px; resize:vertical; line-height:1.5; }
    .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(47,111,235,.12); }
    .modal .actions{ display:flex; align-items:center; gap:8px; margin-top:18px; }
    .modal .actions .sp{ flex:1; }
    .modal .hint{ font-size:12.5px; color:var(--muted); line-height:1.6; margin:0 0 14px; }

    @media (max-width:1240px){ .page{ padding-right:24px; } }
    @media (max-width:620px){ .frow{ flex-direction:column; gap:12px; } .co,.addco{ width:100%; } }
  </style>
</head>
<body>
  <div class="page">
    <a href="../" class="back">&larr; 운영 대시보드 홈</a>

    <header>
      <div>
        <h1>투자 리서치</h1>
        <p class="sub">산업 → 단계 → 종목 → 재무. 위에서 아래로 좁혀가며 공부하고 정리</p>
      </div>
      <div class="toolbar">
        <button class="btn primary" id="addCoBtn">＋ 종목</button>
        <button class="sync" id="syncBtn"><span class="dot"></span><span id="syncLabel">로컬만</span></button>
        <button class="btn" id="exportBtn">내보내기</button>
        <button class="btn" id="importBtn">불러오기</button>
        <input type="file" id="importFile" accept="application/json" style="display:none">
      </div>
    </header>

    <div class="tabs" id="tabs"></div>
    <div class="indhead" id="indhead"></div>
    <div class="bar" id="bar"></div>
    <div id="stages"></div>

    <div class="foot">
      <b>탑다운으로 보세요</b> — 위 탭에서 산업을 고르면 그 산업의 밸류체인 단계와 종목이 펼쳐집니다. 종목을 누르면 재무·밸류·판단이 나와요.
      아직 예시 값이라 실제 검토 값으로 고쳐 쓰시면 됩니다. 동기화 주소를 넣으면 여러 기기에서 같은 내용이 보입니다.
    </div>
  </div>

  <div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

  <script src="../nav.js"></script>
  <script src="../footer.js"></script>
  <script src="../sidebar.js"></script>
  <script>
  // ===LOGIC_START===
  // 화면과 분리된 순수 로직 (자동 테스트 대상, DOM 미참조)
  var RS = (function () {
    var VERDICTS = ["관심", "매수", "보유", "매도", "제외"];
    var _c = 0;
    function uid(p) { return p + Date.now().toString(36) + (_c++).toString(36); }
    function clone(s) { return JSON.parse(JSON.stringify(s)); }

    function seed() {
      return {
        version: 2,
        sync: { url: "" },
        industries: [
          { id: "ind_semi", name: "반도체", macro: "AI로 수요 폭발 — 지금 가장 유망한 산업. 밸류체인 사이클대로 로테이션 중." },
          { id: "ind_index", name: "지수·ETF", macro: "포트폴리오의 축 (지수 + α). 30% 비중." }
        ],
        stages: [
          { id: "st_fab", industryId: "ind_semi", name: "팹리스 (설계)", tag: "" },
          { id: "st_idm", industryId: "ind_semi", name: "IDM (종합·메모리)", tag: "" },
          { id: "st_foundry", industryId: "ind_semi", name: "파운드리 (위탁생산)", tag: "" },
          { id: "st_front", industryId: "ind_semi", name: "전공정 장비", tag: "지금 국면" },
          { id: "st_mat", industryId: "ind_semi", name: "소재·화학", tag: "" },
          { id: "st_back", industryId: "ind_semi", name: "후공정", tag: "" },
          { id: "st_idx", industryId: "ind_index", name: "핵심 지수", tag: "" }
        ],
        companies: [
          co("st_fab", "NVDA", "엔비디아", "GPU 사실상 독점 90%+", "115%", "62%", "우수", "52", "48", "1.3", "보유", "AI 가속기 1등. 밸류 부담 있지만 해자 최강.", "2026-06"),
          co("st_foundry", "TSM", "TSMC", "파운드리 1등 60%+", "28%", "45%", "우수", "28", "7", "1.1", "보유", "미세공정 독주. 증설 지속.", "2026-06"),
          co("st_front", "ASML", "ASML", "EUV 노광 100% 독점", "50%", "33%", "우수", "38", "18", "1.6", "보유", "노광 대체 불가 독점.", "2026-06"),
          co("st_front", "AMAT", "어플라이드머티어리얼즈", "증착·식각 장비 상위", "45%", "29%", "양호", "24", "9", "1.4", "매수", "전공정 로테이션 초입 신규 편입.", "2026-06"),
          co("st_front", "LRCX", "램리서치", "식각 장비 강자", "55%", "30%", "양호", "26", "12", "1.5", "매수", "식각 비중 확대 수혜. 신규.", "2026-06"),
          co("st_front", "KLAC", "KLA", "검사·계측 50%+", "90%", "40%", "우수", "30", "22", "1.7", "보유", "검사 독점적 지위. 수익성 최상.", "2026-06"),
          co("st_idx", "VOO", "S&P500", "지수", "", "", "", "", "", "", "보유", "포트폴리오 지수 축.", "2026-06"),
          co("st_idx", "QQQ", "나스닥100", "지수", "", "", "", "", "", "", "보유", "성장주 지수 축.", "2026-06")
        ]
      };
    }
    function co(stageId, ticker, name, moat, roe, opm, fcf, per, pbr, peg, verdict, note, reviewedAt) {
      return { id: uid("c_"), stageId: stageId, ticker: ticker, name: name, moat: moat, roe: roe, opm: opm, fcf: fcf,
        per: per, pbr: pbr, peg: peg, verdict: verdict || "관심", note: note || "", reviewedAt: reviewedAt || "" };
    }

    // 산업
    function addIndustry(state, name, macro) { var s = clone(state); var id = uid("ind_");
      s.industries.push({ id: id, name: name || "새 산업", macro: macro || "" });
      s.stages.push({ id: uid("st_"), industryId: id, name: "미분류", tag: "" }); return s; }
    function updateIndustry(state, id, patch) { var s = clone(state); s.industries = s.industries.map(function (i) { return i.id === id ? Object.assign(i, patch) : i; }); return s; }
    function moveIndustry(state, id, dir) { var s = clone(state); var i = s.industries.findIndex(function (x) { return x.id === id; }); var j = i + dir;
      if (i < 0 || j < 0 || j >= s.industries.length) return s; var t = s.industries[i]; s.industries[i] = s.industries[j]; s.industries[j] = t; return s; }
    function deleteIndustry(state, id) { var s = clone(state); if (s.industries.length <= 1) return s;
      var sts = s.stages.filter(function (st) { return st.industryId === id; }).map(function (st) { return st.id; });
      s.companies = s.companies.filter(function (c) { return sts.indexOf(c.stageId) < 0; });
      s.stages = s.stages.filter(function (st) { return st.industryId !== id; });
      s.industries = s.industries.filter(function (i) { return i.id !== id; }); return s; }

    // 단계
    function stagesOf(state, industryId) { return state.stages.filter(function (st) { return st.industryId === industryId; }); }
    function addStage(state, industryId, name) { var s = clone(state); s.stages.push({ id: uid("st_"), industryId: industryId, name: name || "새 단계", tag: "" }); return s; }
    function updateStage(state, id, patch) { var s = clone(state); s.stages = s.stages.map(function (st) { return st.id === id ? Object.assign(st, patch) : st; }); return s; }
    function moveStage(state, id, dir) { var s = clone(state); var st = s.stages.find(function (x) { return x.id === id; }); if (!st) return s;
      var sib = s.stages.filter(function (x) { return x.industryId === st.industryId; });
      var gi = s.stages.indexOf(st); var pos = sib.indexOf(st); var target = sib[pos + dir]; if (!target) return s;
      var gj = s.stages.indexOf(target); var t = s.stages[gi]; s.stages[gi] = s.stages[gj]; s.stages[gj] = t; return s; }
    function deleteStage(state, id) { var s = clone(state); var st = s.stages.find(function (x) { return x.id === id; }); if (!st) return s;
      var sib = s.stages.filter(function (x) { return x.industryId === st.industryId; }); if (sib.length <= 1) return s;
      var to = sib.filter(function (x) { return x.id !== id; })[0].id;
      s.companies = s.companies.map(function (c) { return c.stageId === id ? Object.assign(c, { stageId: to }) : c; });
      s.stages = s.stages.filter(function (x) { return x.id !== id; }); return s; }

    // 종목
    function addCompany(state, data) { var s = clone(state); var c = co(data.stageId); Object.assign(c, data); c.id = uid("c_"); s.companies.push(c); return s; }
    function updateCompany(state, id, patch) { var s = clone(state); s.companies = s.companies.map(function (c) { return c.id === id ? Object.assign(c, patch) : c; }); return s; }
    function deleteCompany(state, id) { var s = clone(state); s.companies = s.companies.filter(function (c) { return c.id !== id; }); return s; }

    function companiesOf(state, stageId, filter, sort) {
      var arr = state.companies.filter(function (c) { return c.stageId === stageId; });
      if (filter && filter !== "전체") arr = arr.filter(function (c) { return c.verdict === filter; });
      arr.sort(function (a, b) {
        if (sort === "판단") return VERDICTS.indexOf(a.verdict) - VERDICTS.indexOf(b.verdict);
        if (sort === "티커") return (a.ticker || "").localeCompare(b.ticker || "");
        return (b.reviewedAt || "").localeCompare(a.reviewedAt || "");
      });
      return arr;
    }
    function summary(state, industryId) {
      var stIds = state.stages.filter(function (st) { return st.industryId === industryId; }).map(function (st) { return st.id; });
      var cos = state.companies.filter(function (c) { return stIds.indexOf(c.stageId) >= 0; });
      var by = {}; VERDICTS.forEach(function (v) { by[v] = 0; });
      cos.forEach(function (c) { if (by[c.verdict] != null) by[c.verdict]++; });
      return { total: cos.length, byVerdict: by, stages: stIds.length };
    }
    function validate(o) { return o && typeof o === "object" && Array.isArray(o.industries) && Array.isArray(o.stages) && Array.isArray(o.companies) && o.industries.length > 0; }

    return { VERDICTS: VERDICTS, seed: seed, validate: validate,
      addIndustry: addIndustry, updateIndustry: updateIndustry, moveIndustry: moveIndustry, deleteIndustry: deleteIndustry,
      stagesOf: stagesOf, addStage: addStage, updateStage: updateStage, moveStage: moveStage, deleteStage: deleteStage,
      addCompany: addCompany, updateCompany: updateCompany, deleteCompany: deleteCompany,
      companiesOf: companiesOf, summary: summary };
  })();
  // ===LOGIC_END===

  (function () {
    if (typeof document === "undefined") return;
    var KEY = "stockResearch_v2";
    var state = localLoad();
    var ui = { industryId: state.industries[0].id, filter: "전체", sort: "검토일" };

    function localLoad() { try { var r = localStorage.getItem(KEY); if (r) { var o = JSON.parse(r); if (RS.validate(o)) return o; } } catch (e) {} return RS.seed(); }
    function localSave() { localStorage.setItem(KEY, JSON.stringify(state)); }
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
    function vkey(v) { return { "관심": "watch", "매수": "buy", "보유": "hold", "매도": "sell", "제외": "drop" }[v]; }

    function commit(next) { state = next; localSave(); ensureIndustry(); render(); syncPush(); }
    function ensureIndustry() { if (!state.industries.find(function (i) { return i.id === ui.industryId; })) ui.industryId = state.industries[0].id; }

    // ---------- 동기화 ----------
    function syncUrl() { return (state.sync && state.sync.url) || ""; }
    function setSync(cls, label) { var el = document.getElementById("syncBtn"); el.className = "sync" + (cls ? " " + cls : ""); document.getElementById("syncLabel").textContent = label; }
    function syncPull() {
      var url = syncUrl(); if (!url) { setSync("", "로컬만"); return Promise.resolve(); }
      setSync("busy", "불러오는 중");
      return fetch(url, { method: "GET" }).then(function (r) { return r.json(); }).then(function (o) {
        if (RS.validate(o)) { state = o; localSave(); ensureIndustry(); render(); setSync("on", "동기화됨"); }
        else { syncPush(); setSync("on", "동기화됨(초기화)"); }
      }).catch(function () { setSync("err", "오프라인(로컬)"); });
    }
    var pushT = null;
    function syncPush() {
      var url = syncUrl(); if (!url) return;
      clearTimeout(pushT); setSync("busy", "저장 중");
      pushT = setTimeout(function () {
        fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(state) })
          .then(function () { setSync("on", "동기화됨"); })
          .catch(function () { setSync("err", "저장 실패(로컬은 됨)"); });
      }, 500);
    }

    // ---------- 렌더 ----------
    function render() { renderTabs(); renderIndHead(); renderBar(); renderStages(); }

    function renderTabs() {
      var host = document.getElementById("tabs");
      host.innerHTML = state.industries.map(function (i) {
        var n = RS.summary(state, i.id).total;
        return '<button class="tab' + (i.id === ui.industryId ? ' on' : '') + '" data-i="' + i.id + '">' + esc(i.name) + '<span class="c">' + n + '</span></button>';
      }).join('') + '<button class="tab add" id="addIndTab">＋ 산업</button>';
      host.querySelectorAll(".tab[data-i]").forEach(function (t) { t.onclick = function () { ui.industryId = t.dataset.i; render(); }; });
      document.getElementById("addIndTab").onclick = function () {
        var name = prompt("새 산업 이름 (예: 2차전지, 방산, 바이오)", ""); if (!name || !name.trim()) return;
        var macro = prompt("왜 지금 이 산업인가 (한 줄, 비워도 됨)", "") || "";
        var next = RS.addIndustry(state, name.trim(), macro.trim());
        ui.industryId = next.industries[next.industries.length - 1].id; commit(next);
      };
    }

    function renderIndHead() {
      var ind = state.industries.find(function (i) { return i.id === ui.industryId; });
      var el = document.getElementById("indhead");
      el.innerHTML =
        '<div class="txt"><div class="why">왜 지금 이 산업</div>' +
        '<div class="macro' + (ind.macro ? '' : ' empty') + '">' + (ind.macro ? esc(ind.macro) : "아직 안 적음 — 수정으로 근거를 남겨보세요") + '</div></div>' +
        '<div class="acts">' +
        '<button class="btn ghost sm" data-a="left" title="왼쪽으로">←</button>' +
        '<button class="btn ghost sm" data-a="right" title="오른쪽으로">→</button>' +
        '<button class="btn ghost sm" data-a="edit">이름·근거</button>' +
        '<button class="btn ghost sm" data-a="addstage">＋단계</button>' +
        '<button class="btn ghost sm" data-a="del">산업 삭제</button>' +
        '</div>';
      el.querySelectorAll("[data-a]").forEach(function (b) { b.onclick = function () { indAction(b.dataset.a); }; });
    }
    function indAction(a) {
      var ind = state.industries.find(function (i) { return i.id === ui.industryId; });
      if (a === "left") commit(RS.moveIndustry(state, ind.id, -1));
      else if (a === "right") commit(RS.moveIndustry(state, ind.id, 1));
      else if (a === "edit") { var name = prompt("산업 이름", ind.name); if (name === null) return;
        var macro = prompt("왜 지금 이 산업인가 (한 줄)", ind.macro || "");
        commit(RS.updateIndustry(state, ind.id, { name: name.trim() || ind.name, macro: (macro || "").trim() })); }
      else if (a === "addstage") { var sn = prompt("새 단계 이름 (예: 전공정, 셀, 양극재)", ""); if (!sn || !sn.trim()) return; commit(RS.addStage(state, ind.id, sn.trim())); }
      else if (a === "del") { if (state.industries.length <= 1) { alert("마지막 산업은 지울 수 없어요."); return; }
        var s = RS.summary(state, ind.id); if (!confirm("'" + ind.name + "' 산업을 통째로 지울까요?" + (s.total ? " 종목 " + s.total + "개도 함께 사라집니다." : ""))) return;
        commit(RS.deleteIndustry(state, ind.id)); }
    }

    function renderBar() {
      var s = RS.summary(state, ui.industryId);
      var sums = '<div class="sum">종목 <b>' + s.total + '</b></div>' +
        RS.VERDICTS.map(function (v) { return '<div class="sum">' + v + ' <b style="color:var(--v-' + vkey(v) + ')">' + s.byVerdict[v] + '</b></div>'; }).join('');
      var chips = ["전체"].concat(RS.VERDICTS).map(function (v) { return '<button class="chip' + (ui.filter === v ? ' on' : '') + '" data-f="' + v + '">' + v + '</button>'; }).join('');
      document.getElementById("bar").innerHTML =
        '<div class="sums">' + sums + '</div><span class="sp"></span>' + chips +
        '<select class="sort" id="sortSel">' + ["검토일 최신순", "판단순", "티커순"].map(function (o) { var val = o.replace(" 최신순", "").replace("순", ""); return '<option value="' + val + '"' + (ui.sort === val ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select>';
      document.getElementById("bar").querySelectorAll(".chip").forEach(function (c) { c.onclick = function () { ui.filter = c.dataset.f; render(); }; });
      document.getElementById("sortSel").onchange = function (e) { ui.sort = e.target.value; render(); };
    }

    function renderStages() {
      var host = document.getElementById("stages");
      var stages = RS.stagesOf(state, ui.industryId);
      host.innerHTML = stages.map(function (st) {
        var all = state.companies.filter(function (c) { return c.stageId === st.id; }).length;
        var cos = RS.companiesOf(state, st.id, ui.filter, ui.sort);
        var cards = cos.map(function (c) {
          var metric = [c.roe && ("ROE " + c.roe), c.opm && ("영익 " + c.opm), c.moat].filter(Boolean).slice(0, 2).join(" · ");
          return '<button class="co v-' + esc(c.verdict) + '" data-id="' + c.id + '"><div class="tk">' + esc(c.ticker) + '</div>' +
            '<div class="nm">' + esc(c.name) + '</div><span class="vb v-' + esc(c.verdict) + '">' + esc(c.verdict) + '</span>' +
            (metric ? '<div class="mini">' + esc(metric) + '</div>' : '') + '</button>';
        }).join('');
        var body = cos.length ? cards : (all ? '<div class="emptys">이 필터에 해당 종목 없음</div>' : '<div class="emptys">아직 비어 있음</div>');
        return '<div class="stage" data-sid="' + st.id + '"><div class="sh"><span class="sn">' + esc(st.name) + '</span>' +
          '<span class="sc">' + all + '개</span>' + (st.tag ? '<span class="stag">' + esc(st.tag) + '</span>' : '') +
          '<span class="sa">' +
          '<button class="btn ghost sm" data-act="up" title="위로">↑</button><button class="btn ghost sm" data-act="down" title="아래로">↓</button>' +
          '<button class="btn ghost sm" data-act="rename">이름</button><button class="btn ghost sm" data-act="del">삭제</button></span></div>' +
          '<div class="rack"><div class="cards">' + body + '<button class="addco" data-add="' + st.id + '">＋ 종목</button></div></div></div>';
      }).join('');
      host.querySelectorAll(".co").forEach(function (el) { el.onclick = function () { openCoModal(el.dataset.id); }; });
      host.querySelectorAll(".addco").forEach(function (el) { el.onclick = function () { openCoModal(null, el.dataset.add); }; });
      host.querySelectorAll(".stage").forEach(function (sEl) { var sid = sEl.dataset.sid;
        sEl.querySelectorAll("[data-act]").forEach(function (b) { b.onclick = function () { stageAction(sid, b.dataset.act); }; }); });
    }
    function stageAction(sid, act) {
      var st = state.stages.find(function (x) { return x.id === sid; });
      if (act === "up") commit(RS.moveStage(state, sid, -1));
      else if (act === "down") commit(RS.moveStage(state, sid, 1));
      else if (act === "rename") { var name = prompt("단계 이름", st.name); if (name === null) return;
        var tag = prompt("국면 표시 (없으면 비움, 예: 지금 국면)", st.tag || "");
        commit(RS.updateStage(state, sid, { name: name.trim() || st.name, tag: (tag || "").trim() })); }
      else if (act === "del") { var sib = RS.stagesOf(state, st.industryId); if (sib.length <= 1) { alert("산업의 마지막 단계는 지울 수 없어요."); return; }
        var n = state.companies.filter(function (c) { return c.stageId === sid; }).length;
        if (!confirm("'" + st.name + "' 단계를 지울까요?" + (n ? " 종목 " + n + "개는 같은 산업 첫 단계로 이동합니다." : ""))) return;
        commit(RS.deleteStage(state, sid)); }
    }

    // 종목 모달
    function openCoModal(id, presetStage) {
      var c = id ? state.companies.find(function (x) { return x.id === id; }) : null;
      var stageOpts = state.stages.map(function (st) {
        var ind = state.industries.find(function (i) { return i.id === st.industryId; });
        var sel = (c ? c.stageId : presetStage) === st.id ? " selected" : "";
        return '<option value="' + st.id + '"' + sel + '>' + esc(ind ? ind.name : "") + " · " + esc(st.name) + '</option>';
      }).join('');
      var vOpts = RS.VERDICTS.map(function (v) { return '<option' + (c && c.verdict === v ? ' selected' : (!c && v === "관심" ? ' selected' : '')) + '>' + v + '</option>'; }).join('');
      function val(k) { return c ? esc(c[k]) : ""; }
      document.getElementById("modal").innerHTML =
        '<h3>' + (id ? '종목 수정' : '종목 추가') + '</h3><p class="msub">공부한 내용을 채워 저장. 숫자는 비워둬도 됩니다.</p>' +
        '<div class="frow">' + fld("티커", "ticker", val("ticker"), "예: NVDA") + fld("기업명", "name", val("name"), "예: 엔비디아") + '</div>' +
        '<div class="frow"><div class="field"><label>어디에 (산업 · 단계)</label><select id="f_stageId">' + stageOpts + '</select></div>' +
        '<div class="field"><label>판단</label><select id="f_verdict">' + vOpts + '</select></div></div>' +
        '<div class="frow"><div class="field"><label>해자 (독점·과점·1등)</label><input id="f_moat" value="' + val("moat") + '" placeholder="예: EUV 노광 100% 독점"></div></div>' +
        '<div class="frow trip">' + fld("ROE", "roe", val("roe"), "예: 50%") + fld("영업이익률", "opm", val("opm"), "예: 33%") + fld("FCF", "fcf", val("fcf"), "예: 우수") + '</div>' +
        '<div class="frow trip">' + fld("PER", "per", val("per"), "예: 38") + fld("PBR", "pbr", val("pbr"), "예: 18") + fld("PEG", "peg", val("peg"), "예: 1.6") + '</div>' +
        '<div class="frow">' + fld("검토일", "reviewedAt", val("reviewedAt"), "예: 2026-06") + '</div>' +
        '<div class="frow"><div class="field"><label>공부 메모</label><textarea id="f_note" placeholder="왜 좋은지 / 리스크 / 판단 근거">' + val("note") + '</textarea></div></div>' +
        '<div class="actions">' + (id ? '<button class="btn danger" id="m_del">삭제</button>' : '') + '<span class="sp"></span>' +
        '<button class="btn" id="m_cancel">취소</button><button class="btn primary" id="m_save">' + (id ? '저장' : '추가') + '</button></div>';
      showModal();
      document.getElementById("m_cancel").onclick = hideModal;
      document.getElementById("m_save").onclick = function () {
        var data = { stageId: gv("f_stageId"), verdict: gv("f_verdict"), ticker: gv("f_ticker").trim(), name: gv("f_name").trim(),
          moat: gv("f_moat").trim(), roe: gv("f_roe").trim(), opm: gv("f_opm").trim(), fcf: gv("f_fcf").trim(),
          per: gv("f_per").trim(), pbr: gv("f_pbr").trim(), peg: gv("f_peg").trim(), reviewedAt: gv("f_reviewedAt").trim(), note: gv("f_note").trim() };
        if (!data.ticker && !data.name) { alert("티커나 기업명 중 하나는 입력해 주세요."); return; }
        commit(id ? RS.updateCompany(state, id, data) : RS.addCompany(state, data)); hideModal();
      };
      if (id) document.getElementById("m_del").onclick = function () { if (confirm("'" + (c.ticker || c.name) + "' 을 삭제할까요?")) { commit(RS.deleteCompany(state, id)); hideModal(); } };
    }
    function fld(label, key, value, ph) { return '<div class="field"><label>' + label + '</label><input id="f_' + key + '" value="' + value + '" placeholder="' + ph + '"></div>'; }
    function gv(id) { return document.getElementById(id).value; }
    function showModal() { document.getElementById("overlay").classList.add("on"); }
    function hideModal() { document.getElementById("overlay").classList.remove("on"); }
    document.getElementById("overlay").onclick = function (e) { if (e.target.id === "overlay") hideModal(); };

    // 동기화 설정 모달
    document.getElementById("syncBtn").onclick = function () {
      document.getElementById("modal").innerHTML =
        '<h3>여러 기기 동기화</h3>' +
        '<p class="hint">구글시트에 저장하면 맥·회사PC 어디서 열든 같은 내용이 됩니다. 아래에 <b>연결 주소</b>(구글 앱스스크립트 웹앱 URL)를 붙여넣으세요. 만드는 방법은 따로 안내해 드린 대로 하시면 됩니다. 비워두면 이 브라우저에만 저장돼요.</p>' +
        '<div class="frow"><div class="field"><label>연결 주소</label><input id="f_url" value="' + esc(syncUrl()) + '" placeholder="https://script.google.com/macros/s/.../exec"></div></div>' +
        '<div class="actions"><button class="btn danger" id="s_clear">연결 해제</button><span class="sp"></span><button class="btn" id="s_cancel">취소</button><button class="btn primary" id="s_save">저장하고 동기화</button></div>';
      showModal();
      document.getElementById("s_cancel").onclick = hideModal;
      document.getElementById("s_clear").onclick = function () { state.sync = { url: "" }; localSave(); setSync("", "로컬만"); hideModal(); };
      document.getElementById("s_save").onclick = function () {
        var url = document.getElementById("f_url").value.trim(); state.sync = { url: url }; localSave(); hideModal();
        if (url) syncPull().then(syncPush); else setSync("", "로컬만");
      };
    };

    // 툴바
    document.getElementById("addCoBtn").onclick = function () { var st = RS.stagesOf(state, ui.industryId)[0]; openCoModal(null, st ? st.id : null); };
    document.getElementById("exportBtn").onclick = function () {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "투자리서치.json"; a.click(); URL.revokeObjectURL(a.href);
    };
    document.getElementById("importBtn").onclick = function () { document.getElementById("importFile").click(); };
    document.getElementById("importFile").onchange = function (e) {
      var f = e.target.files[0]; if (!f) return; var rd = new FileReader();
      rd.onload = function () { try { var o = JSON.parse(rd.result); if (!RS.validate(o)) throw 0;
        if (confirm("불러오면 지금 내용을 파일 내용으로 덮어씁니다. 진행할까요?")) commit(o);
      } catch (er) { alert("불러올 수 없는 파일이에요 (형식 확인)."); } e.target.value = ""; };
      rd.readAsText(f);
    };

    render();
    if (syncUrl()) syncPull(); else setSync("", "로컬만");
  })();
  </script>
</body>
</html>
