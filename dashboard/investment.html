<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="./investment.css?v=20260528-static">
  <title>투자 종합 - 운영 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <main class="page">
    <a class="back" href="../">&larr; 대시보드</a>
    <header class="page-head">
      <div>
        <h1>투자 종합</h1>
        <p>무한매수법, VR, Buy & Hold를 한 화면에서 비교합니다.</p>
      </div>
      <span id="data-updated" class="data-chip">데이터 로딩 중</span>
    </header>

    <section class="panel controls">
      <div class="control-grid">
        <label>
          <span>티커</span>
          <select id="ticker-select"></select>
        </label>
        <label>
          <span>시작일</span>
          <input id="start-date" type="date">
        </label>
        <label>
          <span>종료일</span>
          <input id="end-date" type="date">
        </label>
        <label>
          <span>초기자금</span>
          <input id="initial-cash" type="number" min="100" step="1000" value="10000">
        </label>
        <label>
          <span>월 추가투입</span>
          <input id="monthly-contribution" type="number" min="0" step="100" value="0">
        </label>
        <label>
          <span>커스텀 CSV</span>
          <input id="csv-upload" type="file" accept=".csv,text/csv">
        </label>
      </div>
      <div class="strategy-row">
        <label class="check"><input type="checkbox" id="use-bh" checked> Buy & Hold</label>
        <label class="check"><input type="checkbox" id="use-vr" checked> VR</label>
        <label class="check"><input type="checkbox" id="use-ib" checked> 무한매수법</label>
        <button id="run" type="button">백테스트 실행</button>
      </div>
      <details class="params">
        <summary>전략 설정</summary>
        <div class="param-grid">
          <label><span>VR G값</span><input id="vr-g" type="number" min="1" value="20"></label>
          <label><span>VR 밴드 %</span><input id="vr-band" type="number" min="0" step="0.5" value="10"></label>
          <label><span>VR 초기매수 %</span><input id="vr-initial" type="number" min="0" max="100" step="5" value="50"></label>
          <label><span>무매 버전</span><select id="ib-version"><option>V2.1</option><option>V2</option><option>V1</option><option>Custom</option></select></label>
          <label><span>무매 라운드</span><input id="ib-rounds" type="number" min="1" value="40"></label>
          <label><span>익절 목표 %</span><input id="ib-target" type="number" min="1" step="0.5" value="7"></label>
        </div>
      </details>
    </section>

    <section class="metrics" id="metric-cards"></section>

    <section class="panel">
      <div class="panel-head">
        <h2>성과 표</h2>
        <button id="download-metrics" type="button">CSV</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>전략</th>
              <th>최종자산</th>
              <th>총투입금</th>
              <th>손익</th>
              <th>수익률</th>
              <th>CAGR</th>
              <th>MDD</th>
              <th>Sharpe</th>
              <th>거래수</th>
            </tr>
          </thead>
          <tbody id="metrics-body"></tbody>
        </table>
      </div>
    </section>

    <section class="chart-grid">
      <article class="panel chart-panel">
        <h2>자산 곡선</h2>
        <canvas id="equity-chart"></canvas>
      </article>
      <article class="panel chart-panel">
        <h2>MDD / 낙폭</h2>
        <canvas id="drawdown-chart"></canvas>
      </article>
    </section>

    <section class="panel chart-panel">
      <div class="panel-head">
        <h2>가격과 매매 지점</h2>
        <select id="trade-strategy"></select>
      </div>
      <canvas id="trade-chart"></canvas>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>거래 로그</h2>
        <button id="download-trades" type="button">CSV</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>날짜</th>
              <th>전략</th>
              <th>구분</th>
              <th>수량</th>
              <th>가격</th>
              <th>금액</th>
              <th>사유</th>
            </tr>
          </thead>
          <tbody id="trades-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="./investment.js?v=20260528-static"></script>
  <script src="../nav.js"></script>
  <script src="../sidebar.js"></script>
</body>
</html>
