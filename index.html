<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<title>우리동네재테크 운영판</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#F3F5F8; --card:#FFFFFF; --ink:#0F1C2A; --sub:#4A5A6B; --muted:#8393A5; --line:#E1E6EC;
  --blue:#1D5FD1; --blue-soft:#E7EFFC; --ok:#1F7A55; --ok-soft:#E3F3EB; --bad:#C63B26; --bad-soft:#FBE7E3;
  --bar:#B9C9DD; --bar-now:#1D5FD1;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.55;padding:0 16px}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:22px}
.num{font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-size:24px;font-weight:800;letter-spacing:-0.02em}
.stamp{color:var(--muted);font-size:12px}
h2{font-size:16px;font-weight:800;letter-spacing:-0.01em}
.h2row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hint{color:var(--muted);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}

/* 성적 타일 */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile .lbl{font-size:12px;color:var(--sub);font-weight:600}
.tile .val{font-size:24px;font-weight:800;margin-top:2px;letter-spacing:-0.02em}
.tile .cmp{font-size:12px;color:var(--muted);margin-top:2px}

/* 병목 */
.verdict{background:var(--bad-soft);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.verdict b{color:var(--bad)}
.verdict .gain{margin-top:4px;color:var(--sub);font-size:13px}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;align-items:stretch;gap:8px}
.stage{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.stage .s-name{font-size:12px;color:var(--sub);font-weight:600}
.stage .s-val{font-size:20px;font-weight:800}
.link{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:92px;font-size:12px;color:var(--sub);text-align:center}
.link .arrow{font-size:16px;color:var(--muted);line-height:1}
.link .rate{font-size:15px;font-weight:800;color:var(--ink)}
.chip{display:inline-block;margin-top:3px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.link.is-bad .rate{color:var(--bad)}
.sparks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.spark{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.spark.is-bad{border-color:var(--bad)}
.spark .t{font-size:12px;font-weight:700;color:var(--sub);display:flex;justify-content:space-between}
.spark svg{width:100%;height:auto;display:block;margin-top:6px}

/* 월 매출 */
.chartbox{position:relative}
.chartbox svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-120%)}

/* 홈페이지 지도 */
.lane{margin-top:14px}
.lane:first-of-type{margin-top:0}
.lane-title{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px}
.lane-row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.lane-row.path .pg{flex:1 1 200px}
.lane-row .pg{flex:1 1 220px}
.path-arrow{display:flex;align-items:center;color:var(--muted);font-size:16px}
.pg{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--card);min-width:0}
.pg:hover{border-color:var(--blue)}
.pg .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pg .name{font-weight:800;font-size:14px;text-decoration:none}
.pg .name:hover{text-decoration:underline}
.pg .date{font-size:11px;color:var(--muted);white-space:nowrap}
.pg .addr{font-size:12px;color:var(--blue);font-weight:600;word-break:break-all}
.pg .desc{font-size:12px;color:var(--muted)}
.pg .stat{font-size:12px;color:var(--sub)}
.pg .stat b{color:var(--ink)}
.pg .acts{display:flex;gap:6px;margin-top:auto;padding-top:2px;flex-wrap:wrap}
.btn{font:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);background:#F7F9FB;color:var(--sub);border-radius:7px;padding:4px 10px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.btn.copy{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.copy:hover{background:#174CA8;color:#fff}
.btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.fail{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
details.later{margin-top:14px}
details.later summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--muted)}
details.later .lane-row{margin-top:8px}

/* 자료·바로가기 */
.links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lk{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;background:var(--card)}
.lk:hover{border-color:var(--blue)}
.lk b{font-size:13px}
.lk span{font-size:12px;color:var(--muted)}
.err{color:var(--bad);font-size:13px}

@media (max-width:860px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flow{grid-template-columns:1fr}
  .link{flex-direction:row;gap:8px;min-width:0;padding:2px 0}
  .link .arrow{transform:rotate(90deg)}
  .sparks{grid-template-columns:1fr}
  .links{grid-template-columns:1fr 1fr}
  .path-arrow{display:none}
}
@media (max-width:480px){ .links{grid-template-columns:1fr} h1{font-size:21px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>우리동네재테크 운영판</h1>
    <div class="stamp num" id="stamp">숫자 불러오는 중…</div>
  </header>

  <section>
    <div class="h2row"><h2>최근 주 성적</h2><span class="hint" id="weekLabel"></span></div>
    <div class="tiles num" id="tiles"></div>
  </section>

  <section class="card">
    <div class="h2row"><h2>지금 병목</h2><span class="hint">최근 4주 합계 · 콘텐츠관리 시트 기준</span></div>
    <div id="bottleneck"></div>
  </section>

  <section class="card">
    <div class="h2row"><h2>월 매출</h2><span class="hint">노션 상담일지 · 입금 안 한 신청과 환불은 뺀 금액</span></div>
    <div class="chartbox" id="monthly"><div class="tip" id="tip" hidden></div></div>
  </section>

  <section class="card">
    <div class="h2row"><h2>홈페이지</h2><span class="hint">방문자가 움직이는 순서대로 · 파란 버튼 = 아임웹 코드 복사</span></div>
    <div id="homepage"></div>
  </section>

  <section class="card">
    <div class="h2row"><h2>상담·회원 자료</h2></div>
    <div class="links" id="consult"></div>
  </section>

  <section>
    <div class="h2row"><h2>바로가기</h2></div>
    <div class="links" id="shortcuts"></div>
  </section>
</div>

<script src="./site-config.js?v=20261007-ops"></script>
<script>
(function(){
  var site = window.DASHBOARD_SITE || {sections:[]};
  var byId = {};
  site.sections.forEach(function(s){ (s.items||[]).forEach(function(it){ byId[it.id] = it; }); });

  // ---------- 공통 ----------
  function esc(v){ var el=document.createElement('span'); el.textContent = v==null?'':String(v); return el.innerHTML; }
  function won(n){ if(n>=10000) return (Math.round(n/10000)).toLocaleString('ko-KR')+'만 원'; return n.toLocaleString('ko-KR')+'원'; }
  function md(s){ var m=String(s||'').match(/(\d{4})-(\d{2})-(\d{2})/); return m? (+m[2])+'/'+(+m[3]) : ''; }
  function pct(n,d){ return d>0 ? n/d*100 : 0; }
  function f1(x){ return (Math.round(x*10)/10).toFixed(1); }
  function href(it){ return it.href.indexOf('http')===0 ? it.href : './'+it.href; }

  // ---------- 숫자 ----------
  Promise.all([
    fetch('./data/funnel.json?t='+Date.now(),{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('funnel '+r.status); return r.json(); }),
    fetch('./data/sales.json?t='+Date.now(),{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('sales '+r.status); return r.json(); })
  ]).then(function(res){
    var funnel=res[0], sales=res[1];
    var hist=(funnel.weekly_history||[]).filter(function(w){ return w.landing_visits>0 && w.key_views>0 && w.pulling_views>0; });
    renderStamp(funnel, sales);
    renderTiles(hist, sales);
    renderBottleneck(hist, funnel.targets||{});
    renderMonthly(sales.monthly||[]);
    renderHomepage(hist);
  }).catch(function(e){
    document.getElementById('stamp').textContent='숫자를 못 불러왔어요';
    document.getElementById('bottleneck').innerHTML='<p class="err">숫자 파일을 못 읽었어요 ('+esc(e.message)+'). 매일 아침 6시 자동 작업이 돌았는지 확인해 주세요.</p>';
    renderHomepage([]);
  });

  function renderStamp(funnel, sales){
    var u=new Date(funnel.updated||sales.updated);
    document.getElementById('stamp').textContent = isNaN(u) ? '' : '숫자 갱신 '+(u.getMonth()+1)+'/'+u.getDate()+' '+String(u.getHours()).padStart(2,'0')+':'+String(u.getMinutes()).padStart(2,'0')+' · 매일 아침 6시';
  }

  function renderTiles(hist, sales){
    var w=hist[hist.length-1]||{}, p=hist[hist.length-2]||{};
    document.getElementById('weekLabel').textContent = w.week_start ? md(w.week_start)+'~'+md(w.week_end)+' · 시트에 마지막으로 채운 주' : '';
    var sm=sales.summary||{};
    function cmp(cur,prev,unit){ if(prev==null) return ''; var d=cur-prev; return '전주 '+prev.toLocaleString('ko-KR')+unit+' → '+(d>=0?'+':'')+d.toLocaleString('ko-KR'); }
    var tiles=[
      {lbl:'이번 달 매출 ('+(+String(sm.current_month_label||'').slice(5))+'월, 진행 중)', val:won(sm.current_month||0), cmp:'지난달 '+won(sm.last_month||0)},
      {lbl:'구매', val:(w.paid_customers||0)+'명', cmp:cmp(w.paid_customers||0,p.paid_customers,'명')},
      {lbl:'랜딩 방문', val:(w.landing_visits||0).toLocaleString('ko-KR')+'명', cmp:cmp(w.landing_visits||0,p.landing_visits,'명')},
      {lbl:'구독자', val:(w.subscribers_total||0).toLocaleString('ko-KR'), cmp: w.subscriber_increase? '그 주 +'+w.subscriber_increase.toLocaleString('ko-KR') : ''}
    ];
    document.getElementById('tiles').innerHTML = tiles.map(function(t){
      return '<div class="tile"><div class="lbl">'+esc(t.lbl)+'</div><div class="val">'+esc(t.val)+'</div><div class="cmp">'+esc(t.cmp)+'</div></div>';
    }).join('');
  }

  // ---------- 병목 ----------
  function renderBottleneck(hist, targets){
    var box=document.getElementById('bottleneck');
    var last4=hist.slice(-4);
    if(last4.length<4){ box.innerHTML='<p class="err">4주치 숫자가 아직 없어요.</p>'; return; }
    function sum(k){ return last4.reduce(function(a,w){ return a+(w[k]||0); },0); }
    var pull=sum('pulling_views'), key=sum('key_views'), land=sum('landing_visits'), buy=sum('paid_customers'), rev=sum('revenue');
    var steps=[
      {name:'풀링 → 키', from:'pulling_views', to:'key_views', rate:pct(key,pull), target:targets.interest_rate||20},
      {name:'키 → 랜딩', from:'key_views', to:'landing_visits', rate:pct(land,key), target:targets.link_click_rate||2.5},
      {name:'랜딩 → 구매', from:'landing_visits', to:'paid_customers', rate:pct(buy,land), target:targets.convert_rate||3}
    ];
    steps.forEach(function(s){ s.score=s.rate/s.target; });
    var worst=steps.reduce(function(a,b){ return b.score<a.score?b:a; });
    var price = buy>0 ? rev/buy : 0;
    var moreBuy = worst.score<1 ? buy*(1/worst.score) - buy : 0;

    var verdict = worst.score<1
      ? '<b>'+esc(worst.name)+'</b> 칸이 막혀 있어요. 지금 '+f1(worst.rate)+'%인데 목표는 '+f1(worst.target)+'%예요.'
        + '<div class="gain">이 칸만 목표대로 되면 4주 구매가 '+buy+'명 → 약 '+Math.round(buy+moreBuy)+'명'
        + (price? ', 매출은 약 '+won(Math.round(moreBuy*price/10000)*10000)+' 더 들어와요 (1명 평균 '+won(Math.round(price/10000)*10000)+' 기준).' : '.')
        + '</div>'
      : '<b>모든 칸이 목표를 넘겼어요.</b> 목표를 올릴 때예요.';

    var stages=[['풀링 조회',pull],['키 조회',key],['랜딩 방문',land],['구매',buy]];
    var flow='';
    stages.forEach(function(st,i){
      flow+='<div class="stage"><div class="s-name">'+st[0]+'</div><div class="s-val num">'+st[1].toLocaleString('ko-KR')+(i===3?'명':'')+'</div></div>';
      if(i<3){
        var s=steps[i], ok=s.rate>=s.target;
        flow+='<div class="link'+(s===worst&&!ok?' is-bad':'')+'"><span class="arrow">→</span><span class="rate num">'+f1(s.rate)+'%</span><span>목표 '+f1(s.target)+'%</span>'
          +'<span class="chip '+(ok?'ok':'bad')+'">'+(ok?'통과':(s===worst?'병목':'미달'))+'</span></div>';
      }
    });

    var last12=hist.slice(-12);
    var sparks=steps.map(function(s){
      var vals=last12.map(function(w){ return pct(w[s.to]||0,w[s.from]||0); });
      return '<div class="spark'+(s===worst&&s.score<1?' is-bad':'')+'"><div class="t"><span>'+esc(s.name)+'</span><span class="num">최근 12주</span></div>'+sparkSvg(vals,s.target,last12)+'</div>';
    }).join('');

    box.innerHTML='<div class="verdict">'+verdict+'</div><div class="flow">'+flow+'</div><div class="sparks">'+sparks+'</div>';
  }

  function sparkSvg(vals,target,weeks){
    var W=300,H=90,L=30,R=8,T=8,B=18;
    var max=Math.max(target*1.6, Math.max.apply(null,vals)*1.1);
    var x=function(i){ return L+i*(W-L-R)/Math.max(vals.length-1,1); };
    var y=function(v){ return T+(1-v/max)*(H-T-B); };
    var pts=vals.map(function(v,i){ return x(i)+','+y(v); }).join(' ');
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="주별 비율과 목표">';
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="#E1E6EC"/>';
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(target)+'" y2="'+y(target)+'" stroke="#C63B26" stroke-width="1.5" stroke-dasharray="4 4"/>';
    s+='<text x="'+(L-4)+'" y="'+(y(target)+4)+'" text-anchor="end" font-size="10" fill="#C63B26">'+f1(target)+'</text>';
    s+='<text x="'+(L-4)+'" y="'+(y(0)+4)+'" text-anchor="end" font-size="10" fill="#8393A5">0</text>';
    s+='<polyline points="'+pts+'" fill="none" stroke="#1D5FD1" stroke-width="2" stroke-linejoin="round"/>';
    vals.forEach(function(v,i){ s+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="'+(i===vals.length-1?3.5:2)+'" fill="#1D5FD1"><title>'+md(weeks[i].week_start)+' 주 '+f1(v)+'%</title></circle>'; });
    s+='<text x="'+L+'" y="'+(H-4)+'" font-size="10" fill="#8393A5">'+md(weeks[0].week_start)+'</text>';
    s+='<text x="'+(W-R)+'" y="'+(H-4)+'" text-anchor="end" font-size="10" fill="#8393A5">'+md(weeks[weeks.length-1].week_start)+' · '+f1(vals[vals.length-1])+'%</text>';
    return s+'</svg>';
  }

  // ---------- 월 매출 ----------
  function renderMonthly(monthly){
    var box=document.getElementById('monthly'), tip=document.getElementById('tip');
    var m=monthly.slice(-12); if(!m.length) return;
    var W=1000,H=240,L=56,R=10,T=16,B=28;
    var max=Math.max.apply(null,m.map(function(r){return r.revenue;}));
    var step=max>6000000?2000000:1000000; var top=Math.ceil(max/step)*step||step;
    var bw=(W-L-R)/m.length;
    var y=function(v){ return T+(1-v/top)*(H-T-B); };
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="최근 12개월 월 매출">';
    for(var g=0; g<=top; g+=step){ s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(g)+'" y2="'+y(g)+'" stroke="#EEF1F5"/><text x="'+(L-8)+'" y="'+(y(g)+4)+'" text-anchor="end" font-size="12" fill="#8393A5">'+(g/10000)+'만</text>'; }
    m.forEach(function(r,i){
      var now=i===m.length-1, x0=L+i*bw+bw*0.2, w=bw*0.6, h=Math.max(y(0)-y(r.revenue),0);
      s+='<rect x="'+x0+'" y="'+(y(0)-h)+'" width="'+w+'" height="'+h+'" rx="4" fill="'+(now?'#1D5FD1':'#B9C9DD')+'"'+(now?' fill-opacity=".55"':'')+'/>';
      s+='<text x="'+(x0+w/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="12" fill="#4A5A6B">'+(+r.month.slice(5))+'월'+(now?'·진행 중':'')+'</text>';
      s+='<rect data-i="'+i+'" x="'+(L+i*bw)+'" y="'+T+'" width="'+bw+'" height="'+(H-T-B)+'" fill="transparent"/>';
    });
    var best=m.reduce(function(a,b){return b.revenue>a.revenue?b:a;}), bi=m.indexOf(best);
    s+='<text x="'+(L+bi*bw+bw/2)+'" y="'+(y(best.revenue)-6)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#0F1C2A">'+won(best.revenue)+'</text>';
    s+='</svg>';
    box.insertAdjacentHTML('beforeend',s);
    box.querySelectorAll('rect[data-i]').forEach(function(r){
      r.addEventListener('mouseenter',function(){
        var i=+r.dataset.i, d=m[i], k=box.querySelector('svg').getBoundingClientRect().width/W;
        tip.textContent=d.month.replace('-','년 ')+'월 · '+won(d.revenue)+' · '+d.customers+'명';
        tip.style.left=(L+i*bw+bw/2)*k+'px'; tip.style.top=y(d.revenue)*k+'px'; tip.hidden=false;
      });
      r.addEventListener('mouseleave',function(){ tip.hidden=true; });
    });
  }

  // ---------- 홈페이지 ----------
  var LANES=[
    {title:'파는 길 — 방문자가 이 순서로 움직여요', path:true, ids:['main-page','landing-page-v3','coaching-payment-modal-demo','coaching-payment']},
    {title:'둘러보는 페이지', ids:['curriculum-page','refund-policy','fire-retirement-calculator','investment-philosophy']},
    {title:'모든 페이지 공통 (고치면 전부 바뀜)', ids:['imweb-header-code','imweb-footer-code','common-header','common-footer']}
  ];
  var LATER=['lecture-allinone','lecture-bookclub'];

  function pageCard(it, hist){
    if(!it) return '';
    var w=hist[hist.length-1];
    var stat = (it.id==='landing-page-v3' && w) ? '<div class="stat">최근 주 방문 <b>'+w.landing_visits+'명</b> · 구매 <b>'+(w.paid_customers||0)+'명</b></div>' : '';
    var copy = it.imwebCode ? '<button type="button" class="btn copy" data-copy="'+esc(it.imwebCode)+'">아임웹 코드 복사</button>' : '';
    return '<div class="pg">'
      +'<div class="top"><a class="name" href="'+esc(href(it))+'" target="_blank" rel="noopener">'+esc(it.title)+'</a>'
      +'<span class="date num" data-date="'+esc(it.imwebCode||'')+'" data-suffix="'+esc(it.dateSuffix||'')+'"></span></div>'
      +(it.publicPath? '<div class="addr">'+esc(it.publicPath.replace('~','ourdongne.com'))+'</div>' : '')
      +'<div class="desc">'+esc(it.description||'')+'</div>'+stat
      +'<div class="acts"><a class="btn" href="'+esc(href(it))+'" target="_blank" rel="noopener">열기</a>'+copy+'</div>'
      +'</div>';
  }

  function renderHomepage(hist){
    var html=LANES.map(function(l){
      var cards=l.ids.map(function(id){ return pageCard(byId[id],hist); }).filter(Boolean);
      return '<div class="lane"><div class="lane-title">'+esc(l.title)+'</div><div class="lane-row'+(l.path?' path':'')+'">'
        +cards.join(l.path?'<span class="path-arrow" aria-hidden="true">→</span>':'')+'</div></div>';
    }).join('');
    html+='<details class="later"><summary>준비 중인 페이지 '+LATER.length+'개</summary><div class="lane-row">'+LATER.map(function(id){ return pageCard(byId[id],hist); }).join('')+'</div></details>';
    document.getElementById('homepage').innerHTML=html;
    fillDates();
  }

  // 아임웹 코드 파일의 마지막 수정일 (GitHub Pages가 알려주는 날짜)
  function fillDates(){
    document.querySelectorAll('[data-date]').forEach(function(el){
      var src=el.getAttribute('data-date'); if(!src) return;
      fetch('./'+src,{method:'HEAD',cache:'no-store'}).then(function(r){
        var d=new Date(r.headers.get('Last-Modified')); if(isNaN(d)) return;
        var sfx=el.getAttribute('data-suffix');
        el.textContent='수정 '+(d.getMonth()+1)+'/'+d.getDate()+(sfx?' ('+sfx+')':'');
        el.title='아임웹 코드 마지막 수정: '+d.toLocaleString('ko-KR');
      }).catch(function(){});
    });
  }

  document.addEventListener('click',function(e){
    var btn=e.target.closest('[data-copy]'); if(!btn||btn.disabled) return;
    var src=btn.getAttribute('data-copy'), label=btn.textContent;
    btn.disabled=true; btn.textContent='가져오는 중…';
    fetch('./'+src+'?t='+Date.now(),{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
      .then(function(t){ return navigator.clipboard.writeText(t); })
      .then(function(){ btn.textContent='복사됐어요'; btn.classList.add('done'); })
      .catch(function(err){ console.error('[복사 실패]',src,err); btn.textContent='복사 실패'; btn.classList.add('fail'); })
      .then(function(){ setTimeout(function(){ btn.textContent=label; btn.classList.remove('done','fail'); btn.disabled=false; },2000); });
  });

  // ---------- 상담·바로가기 ----------
  function linkCard(it, note){
    if(!it) return '';
    return '<a class="lk" href="'+esc(href(it))+'" target="_blank" rel="noopener"><b>'+esc(it.title)+'</b><span>'+esc(note||it.description||'')+'</span></a>';
  }
  document.getElementById('consult').innerHTML=[
    linkCard(byId['consult-root']), linkCard(byId['consult-prep']), linkCard(byId['consult-ppt-template']),
    linkCard(byId['consult-asset-planner']), linkCard(byId['recommended-books'],'상담 90일차에 보내는 독서 로드맵'), linkCard(byId['consult-180day-column'],'상담 180일차에 보내는 투자 로드맵')
  ].join('');
  document.getElementById('shortcuts').innerHTML=[linkCard(byId['yt-bulk-editor'])].join('');
})();
</script>
</body>
</html>
