<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<title>우리동네재테크 운영판</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#F3F5F8; --card:#FFFFFF; --ink:#0F1C2A; --sub:#4A5A6B; --muted:#8393A5; --line:#E1E6EC;
  --blue:#1D5FD1; --blue-soft:#E7EFFC; --ok:#1F7A55; --ok-soft:#E3F3EB; --bad:#C63B26; --bad-soft:#FBE7E3;
  --bar:#B9C9DD; --bar-now:#1D5FD1;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.55;padding:0 16px}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 64px;display:flex;flex-direction:column;gap:22px}
.num{font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-size:24px;font-weight:800;letter-spacing:-0.02em}
.stamp{color:var(--muted);font-size:12px}
h2{font-size:16px;font-weight:800;letter-spacing:-0.01em}
.h2row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hint{color:var(--muted);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}

/* 성적 타일 */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile .lbl{font-size:12px;color:var(--sub);font-weight:600}
.tile .val{font-size:24px;font-weight:800;margin-top:2px;letter-spacing:-0.02em}
.tile .cmp{font-size:12px;color:var(--muted);margin-top:2px}

/* 병목 */
.verdict{background:var(--bad-soft);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.verdict b{color:var(--bad)}
.verdict .gain{margin-top:4px;color:var(--sub);font-size:13px}
.funnel{display:flex;flex-direction:column;max-width:760px}
.fr{display:grid;grid-template-columns:90px 1fr 80px;align-items:center;gap:10px}
.fr-name{font-weight:700}
.fr-bar{height:24px;border-radius:0 5px 5px 0;background:#1D5FD1}
.fr-bar.bad{background:var(--bad)}
.fr-val{text-align:right;font-weight:800;font-size:15px}
.fs{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:7px 0;color:var(--sub);font-size:13px}
.fs.bad{color:var(--bad);font-weight:700}
.chip{display:inline-block;margin-left:4px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:700}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.sub-h{font-size:13px;font-weight:700;color:var(--sub);margin:20px 0 6px}
#bottleneck svg{width:100%;height:auto;display:block}
.zones{display:flex;flex-direction:column;gap:5px;max-width:760px}
.zr{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;font-size:13px}
.zb{height:12px;border-radius:0 4px 4px 0;background:#B9C9DD}
.zr.hot{color:var(--bad);font-weight:700}
.zr.hot .zb{background:var(--bad)}
.zv{text-align:right}
/* 상담 순서표 */
.journey{display:flex;flex-direction:column}
.jp{font-size:12px;font-weight:800;color:var(--blue);padding:14px 0 6px;border-bottom:1px solid var(--line)}
.jp:first-child{padding-top:0}
.jr{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.j-when{font-weight:800;font-size:13px}
.j-body b{font-size:14px}
.j-how{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:#F1F4F8;color:var(--sub);margin-left:4px}
.j-how.auto{background:var(--ok-soft);color:var(--ok)}
.j-note{font-size:12px;color:var(--muted);margin-top:2px}
.j-body .date{margin-top:4px}
.j-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.date{font-size:12px;color:var(--ink);font-weight:600;background:#F1F4F8;border-radius:6px;padding:2px 8px;width:fit-content}
/* 월 매출 */
.chartbox{position:relative}
.chartbox svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:5px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-120%)}

/* 홈페이지 지도 */
.lane{margin-top:14px}
.lane:first-of-type{margin-top:0}
.lane-title{font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px}
.lane-row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.lane-row.path .pg{flex:1 1 170px}
.lane-row .pg{flex:1 1 220px}
.path-arrow{display:flex;align-items:center;color:var(--muted);font-size:16px}
.pg{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--card);min-width:0}
.pg:hover{border-color:var(--blue)}
.pg .name{font-weight:800;font-size:14px;text-decoration:none}
.pg .name:hover{text-decoration:underline}
.pg .date{font-size:12px;color:var(--ink);font-weight:600;background:#F1F4F8;border-radius:6px;padding:2px 8px;width:fit-content}
.pg .when{font-size:12px;font-weight:800;color:var(--blue)}
.pg .where{font-size:12px;color:var(--sub)}
.pg .addr{font-size:12px;color:var(--blue);font-weight:700;word-break:break-all;text-decoration:none;width:fit-content}
.pg a.addr:hover{text-decoration:underline}
.pg .addr.none{color:var(--muted);font-weight:500}
.btn.live{border-color:var(--blue);color:var(--blue);background:#fff}
.pg .desc{font-size:12px;color:var(--muted)}
.pg .stat{font-size:12px;color:var(--sub)}
.pg .stat b{color:var(--ink)}
.pg .acts{display:flex;gap:6px;margin-top:auto;padding-top:2px;flex-wrap:wrap}
.btn{font:inherit;font-size:12px;font-weight:700;border:1px solid var(--line);background:#F7F9FB;color:var(--sub);border-radius:7px;padding:4px 10px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.btn.copy{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.copy:hover{background:#174CA8;color:#fff}
.btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.fail{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
details.later{margin-top:14px}
details.later summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--muted)}
details.later .lane-row{margin-top:8px}

/* 자료·바로가기 */
.links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lk{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;background:var(--card)}
.lk:hover{border-color:var(--blue)}
.lk b{font-size:13px}
.lk span{font-size:12px;color:var(--muted)}
.err{color:var(--bad);font-size:13px}

@media (max-width:860px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fr{grid-template-columns:72px 1fr 64px}
  .fs{grid-template-columns:72px 1fr}
  .jr{grid-template-columns:72px 1fr}
  .j-acts{grid-column:2;justify-content:flex-start}
  .links{grid-template-columns:1fr 1fr}
  .path-arrow{display:none}
}
@media (max-width:480px){ .links{grid-template-columns:1fr} h1{font-size:21px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>우리동네재테크 운영판</h1>
    <div class="stamp num" id="stamp">숫자 불러오는 중…</div>
  </header>

  <section>
    <div class="h2row"><h2>최근 주 성적</h2><span class="hint" id="weekLabel"></span></div>
    <div class="tiles num" id="tiles"></div>
  </section>

  <section class="card">
    <div class="h2row"><h2>지금 병목</h2><span class="hint">최근 4주 합계 · 콘텐츠관리 시트 기준 · 막대 길이는 보기 좋게 줄였어요</span></div>
    <div id="bottleneck"></div>
  </section>

  <section class="card">
    <div class="h2row"><h2>월 매출</h2><span class="hint">노션 상담일지 · 입금 안 한 신청과 환불은 뺀 금액</span></div>
    <div class="chartbox" id="monthly"><div class="tip" id="tip" hidden></div></div>
  </section>

  <section class="card">
    <div class="h2row"><h2>홈페이지</h2><span class="hint">파란 버튼 = 아임웹에 붙일 코드 복사</span></div>
    <div id="homepage"></div>
  </section>

  <section class="card">
    <div class="h2row"><h2>상담 흐름과 자료</h2><span class="hint">초록 = 저절로 나가는 것</span></div>
    <div id="consult"></div>
  </section>

  <section>
    <div class="h2row"><h2>바로가기</h2></div>
    <div class="links" id="shortcuts"></div>
  </section>
</div>

<script src="./site-config.js?v=20261007-ops"></script>
<script>
(function(){
  var site = window.DASHBOARD_SITE || {sections:[]};
  var byId = {};
  site.sections.forEach(function(s){ (s.items||[]).forEach(function(it){ byId[it.id] = it; }); });

  // ---------- 공통 ----------
  function esc(v){ var el=document.createElement('span'); el.textContent = v==null?'':String(v); return el.innerHTML; }
  function won(n){ if(n>=10000) return (Math.round(n/10000)).toLocaleString('ko-KR')+'만 원'; return n.toLocaleString('ko-KR')+'원'; }
  function md(s){ var m=String(s||'').match(/(\d{4})-(\d{2})-(\d{2})/); return m? (+m[2])+'/'+(+m[3]) : ''; }
  function pct(n,d){ return d>0 ? n/d*100 : 0; }
  function f1(x){ return (Math.round(x*10)/10).toFixed(1); }
  function href(it){ return it.href.indexOf('http')===0 ? it.href : './'+it.href; }

  // ---------- 숫자 ----------
  Promise.all([
    fetch('./data/funnel.json?t='+Date.now(),{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('funnel '+r.status); return r.json(); }),
    fetch('./data/sales.json?t='+Date.now(),{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('sales '+r.status); return r.json(); })
  ]).then(function(res){
    var funnel=res[0], sales=res[1];
    var hist=(funnel.weekly_history||[]).filter(function(w){ return w.landing_visits>0 && w.key_views>0 && w.pulling_views>0; });
    renderStamp(funnel, sales);
    renderTiles(hist, sales);
    renderBottleneck(hist, funnel.targets||{});
    renderMonthly(sales.monthly||[]);
    renderHomepage(hist);
  }).catch(function(e){
    document.getElementById('stamp').textContent='숫자를 못 불러왔어요';
    document.getElementById('bottleneck').innerHTML='<p class="err">숫자 파일을 못 읽었어요 ('+esc(e.message)+'). 매일 아침 6시 자동 작업이 돌았는지 확인해 주세요.</p>';
    renderHomepage([]);
  });

  function renderStamp(funnel, sales){
    var u=new Date(funnel.updated||sales.updated);
    document.getElementById('stamp').textContent = isNaN(u) ? '' : '숫자 갱신 '+(u.getMonth()+1)+'/'+u.getDate()+' '+String(u.getHours()).padStart(2,'0')+':'+String(u.getMinutes()).padStart(2,'0')+' · 매일 아침 6시';
  }

  function renderTiles(hist, sales){
    var w=hist[hist.length-1]||{}, p=hist[hist.length-2]||{};
    document.getElementById('weekLabel').textContent = w.week_start ? md(w.week_start)+'~'+md(w.week_end)+' · 시트에 마지막으로 채운 주' : '';
    var sm=sales.summary||{};
    function cmp(cur,prev,unit){ if(prev==null) return ''; var d=cur-prev; return '전주 '+prev.toLocaleString('ko-KR')+unit+' → '+(d>=0?'+':'')+d.toLocaleString('ko-KR'); }
    var tiles=[
      {lbl:'이번 달 매출 ('+(+String(sm.current_month_label||'').slice(5))+'월, 진행 중)', val:won(sm.current_month||0), cmp:'지난달 '+won(sm.last_month||0)},
      {lbl:'구매', val:(w.paid_customers||0)+'명', cmp:cmp(w.paid_customers||0,p.paid_customers,'명')},
      {lbl:'랜딩 방문', val:(w.landing_visits||0).toLocaleString('ko-KR')+'명', cmp:cmp(w.landing_visits||0,p.landing_visits,'명')},
      {lbl:'구독자', val:(w.subscribers_total||0).toLocaleString('ko-KR'), cmp: w.subscriber_increase? '그 주 +'+w.subscriber_increase.toLocaleString('ko-KR') : ''}
    ];
    document.getElementById('tiles').innerHTML = tiles.map(function(t){
      return '<div class="tile"><div class="lbl">'+esc(t.lbl)+'</div><div class="val">'+esc(t.val)+'</div><div class="cmp">'+esc(t.cmp)+'</div></div>';
    }).join('');
  }

  // ---------- 병목 ----------
  function renderBottleneck(hist, targets){
    var box=document.getElementById('bottleneck');
    var last4=hist.slice(-4);
    if(last4.length<4){ box.innerHTML='<p class="err">4주치 숫자가 아직 없어요.</p>'; return; }
    function sum(k){ return last4.reduce(function(a,w){ return a+(w[k]||0); },0); }
    var vals={pulling_views:sum('pulling_views'), key_views:sum('key_views'), landing_visits:sum('landing_visits'), paid_customers:sum('paid_customers')};
    var rev=sum('revenue'), buy=vals.paid_customers;
    var stages=[['풀링 조회','pulling_views',''],['키 조회','key_views',''],['랜딩 방문','landing_visits',''],['구매','paid_customers','명']];
    var steps=[
      {name:'풀링 → 키', from:'pulling_views', to:'key_views', target:targets.interest_rate||20},
      {name:'키 → 랜딩', from:'key_views', to:'landing_visits', target:targets.link_click_rate||2.5},
      {name:'랜딩 → 구매', from:'landing_visits', to:'paid_customers', target:targets.convert_rate||3}
    ];
    steps.forEach(function(st){ st.rate=pct(vals[st.to],vals[st.from]); st.score=st.rate/st.target; });
    var worst=steps.reduce(function(x,y){ return y.score<x.score?y:x; });
    var stuck=worst.score<1;
    var price=buy>0?rev/buy:0, more=stuck?buy/worst.score-buy:0;

    var head = stuck
      ? '<b>'+esc(worst.name)+'</b> 칸에서 막혀요. 100명 중 '+f1(worst.rate)+'명만 넘어가요 (목표 '+f1(worst.target)+'명).'
        +'<div class="gain">이 칸만 목표대로면 4주 구매 '+buy+'명 → 약 '+Math.round(buy+more)+'명'+(price?' · 매출 약 '+won(Math.round(more*price/10000)*10000)+' 더':'')+'</div>'
      : '<b>모든 칸이 목표를 넘겼어요.</b> 목표를 올릴 때예요.';

    var max=Math.log10(vals.pulling_views||10);
    var rows='';
    stages.forEach(function(sg,i){
      var v=vals[sg[1]], w=Math.max(6, Math.log10(Math.max(v,1))/max*100);
      var last=i===3;
      rows+='<div class="fr"><span class="fr-name">'+sg[0]+'</span><div class="fr-bar'+(last&&stuck&&worst.to==='paid_customers'?' bad':'')+'" style="width:'+w+'%"></div><span class="fr-val num">'+v.toLocaleString('ko-KR')+sg[2]+'</span></div>';
      if(i<3){
        var st=steps[i], ok=st.rate>=st.target, isW=st===worst&&stuck;
        rows+='<div class="fs'+(isW?' bad':'')+'"><span></span><span>↓ '+f1(st.rate)+'%가 넘어감 · 목표 '+f1(st.target)+'% <span class="chip '+(ok?'ok':'bad')+'">'+(ok?'통과':(isW?'막힘':'미달'))+'</span></span></div>';
      }
    });

    var weeks=hist.slice(-12);
    var chart = stuck ? '<div class="sub-h">'+esc(worst.name)+' 칸, 최근 12주</div>'+trendSvg(weeks.map(function(w){ return pct(w[worst.to]||0,w[worst.from]||0); }), worst.target, weeks) : '';
    var zones = (stuck && worst.to==='paid_customers') ? '<div class="sub-h">그럼 랜딩 페이지 어디서 빠질까 — 각 구역까지 내려온 사람</div><div id="zones" class="zones num"><span class="hint">불러오는 중…</span></div>' : '';
    box.innerHTML='<div class="verdict">'+head+'</div><div class="funnel">'+rows+'</div>'+chart+zones;
    if(zones) renderZones();
  }

  // 랜딩 구역 도달 — data/landing-sections.json (GA4, 매일 06시). 병목이 랜딩 → 구매일 때만 보인다
  function renderZones(){
    var el=document.getElementById('zones');
    fetch('./data/landing-sections.json?t='+Date.now(),{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){
        if(!d.visitors || d.visitors<30){
          el.innerHTML='<p class="hint">'+md(d.start)+'부터 새로 세는 중이에요 (지금 방문자 '+(d.visitors||0)+'명). 30명이 넘으면 여기에 구역별 막대가 떠요.</p>';
          return;
        }
        var form=d.sections.filter(function(x){ return x.key==='apply-form'; })[0];
        el.innerHTML='<p class="hint" style="margin-bottom:8px">'+md(d.start)+'부터 방문자 '+d.visitors.toLocaleString('ko-KR')+'명</p>'+d.sections.map(function(x){
          var p=Math.round(x.users/d.visitors*100), hot=x===form;
          return '<div class="zr'+(hot?' hot':'')+'"><span>'+esc(x.label)+'</span><div class="zb" style="width:'+Math.max(p,1)+'%"></div><span class="zv">'+p+'%</span></div>';
        }).join('');
      })
      .catch(function(){ el.innerHTML='<p class="hint">랜딩 구역 숫자 파일이 아직 없어요. 내일 아침 6시 뒤에 생겨요.</p>'; });
  }

  function trendSvg(vals,target,weeks){
    var W=900,H=200,L=40,R=16,T=18,B=26;
    var max=Math.max(target*1.5, Math.max.apply(null,vals)*1.15);
    var x=function(i){ return L+i*(W-L-R)/Math.max(vals.length-1,1); };
    var y=function(v){ return T+(1-v/max)*(H-T-B); };
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="막힌 칸의 주별 비율">';
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(0)+'" y2="'+y(0)+'" stroke="#E1E6EC"/>';
    s+='<text x="'+(L-8)+'" y="'+(y(0)+4)+'" text-anchor="end" font-size="12" fill="#8393A5">0%</text>';
    s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(target)+'" y2="'+y(target)+'" stroke="#C63B26" stroke-width="2" stroke-dasharray="6 5"/>';
    s+='<text x="'+(L-8)+'" y="'+(y(target)+4)+'" text-anchor="end" font-size="12" fill="#C63B26">'+f1(target)+'%</text>';
    s+='<text x="'+(W-R)+'" y="'+(y(target)-6)+'" text-anchor="end" font-size="12" fill="#C63B26">목표</text>';
    var pts=vals.map(function(v,i){ return x(i)+','+y(v); });
    s+='<polygon points="'+L+','+y(0)+' '+pts.join(' ')+' '+(W-R)+','+y(0)+'" fill="#E7EFFC"/>';
    s+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#1D5FD1" stroke-width="2.5" stroke-linejoin="round"/>';
    vals.forEach(function(v,i){
      var lastP=i===vals.length-1;
      s+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="'+(lastP?5:3.5)+'" fill="#1D5FD1" stroke="#fff" stroke-width="2"><title>'+md(weeks[i].week_start)+' 주 · '+f1(v)+'%</title></circle>';
      if(i%2===0||lastP) s+='<text x="'+x(i)+'" y="'+(H-6)+'" text-anchor="middle" font-size="12" fill="#8393A5">'+md(weeks[i].week_start)+'</text>';
    });
    s+='<text x="'+x(vals.length-1)+'" y="'+(y(vals[vals.length-1])-12)+'" text-anchor="end" font-size="13" font-weight="700" fill="#0F1C2A">'+f1(vals[vals.length-1])+'%</text>';
    return s+'</svg>';
  }

  // ---------- 월 매출 ----------
  function renderMonthly(monthly){
    var box=document.getElementById('monthly'), tip=document.getElementById('tip');
    var m=monthly.slice(-12); if(!m.length) return;
    var W=1000,H=240,L=56,R=10,T=16,B=28;
    var max=Math.max.apply(null,m.map(function(r){return r.revenue;}));
    var step=max>6000000?2000000:1000000; var top=Math.ceil(max/step)*step||step;
    var bw=(W-L-R)/m.length;
    var y=function(v){ return T+(1-v/top)*(H-T-B); };
    var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="최근 12개월 월 매출">';
    for(var g=0; g<=top; g+=step){ s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(g)+'" y2="'+y(g)+'" stroke="#EEF1F5"/><text x="'+(L-8)+'" y="'+(y(g)+4)+'" text-anchor="end" font-size="12" fill="#8393A5">'+(g/10000)+'만</text>'; }
    m.forEach(function(r,i){
      var now=i===m.length-1, x0=L+i*bw+bw*0.2, w=bw*0.6, h=Math.max(y(0)-y(r.revenue),0);
      s+='<rect x="'+x0+'" y="'+(y(0)-h)+'" width="'+w+'" height="'+h+'" rx="4" fill="'+(now?'#1D5FD1':'#B9C9DD')+'"'+(now?' fill-opacity=".55"':'')+'/>';
      s+='<text x="'+(x0+w/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="12" fill="#4A5A6B">'+(+r.month.slice(5))+'월'+(now?'·진행 중':'')+'</text>';
      s+='<rect data-i="'+i+'" x="'+(L+i*bw)+'" y="'+T+'" width="'+bw+'" height="'+(H-T-B)+'" fill="transparent"/>';
    });
    var best=m.reduce(function(a,b){return b.revenue>a.revenue?b:a;}), bi=m.indexOf(best);
    s+='<text x="'+(L+bi*bw+bw/2)+'" y="'+(y(best.revenue)-6)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#0F1C2A">'+won(best.revenue)+'</text>';
    s+='</svg>';
    box.insertAdjacentHTML('beforeend',s);
    box.querySelectorAll('rect[data-i]').forEach(function(r){
      r.addEventListener('mouseenter',function(){
        var i=+r.dataset.i, d=m[i], k=box.querySelector('svg').getBoundingClientRect().width/W;
        tip.textContent=d.month.replace('-','년 ')+'월 · '+won(d.revenue)+' · '+d.customers+'명';
        tip.style.left=(L+i*bw+bw/2)*k+'px'; tip.style.top=y(d.revenue)*k+'px'; tip.hidden=false;
      });
      r.addEventListener('mouseleave',function(){ tip.hidden=true; });
    });
  }

  // ---------- 홈페이지 ----------
  // 묶음은 여기서 id로 정한다. 새 페이지는 site-config.js에 넣고 여기에도 id를 추가한다
  var LANES=[
    {title:'손님이 사는 길 — 메인 → 코칭 → 신청 → 결제', path:true, ids:['main-page','landing-page-v3','coaching-payment-modal-demo','coaching-payment']},
    {title:'그 밖의 페이지', ids:['curriculum-page','refund-policy','fire-retirement-calculator','investment-philosophy']},
    {title:'모든 페이지에 붙는 코드 (고치면 전부 바뀜)', ids:['imweb-header-code','imweb-footer-code','common-header','common-footer']}
  ];
  var WHERE={ 'curriculum-page':'홈페이지 위쪽 메뉴에 있음', 'refund-policy':'홈페이지 위쪽 메뉴에 있음', 'fire-retirement-calculator':'작업본에만 있음 · 링크로 보냄', 'investment-philosophy':'작업본에만 있음 · 링크로 보냄' };
  var LATER=['lecture-allinone','lecture-bookclub'];

  function dateLine(it){
    var m=String(it.imwebDate||'').match(/^\d{4}-(\d{2})-(\d{2})$/);
    if(!m) return '';
    return '<div class="date num">'+(+m[1])+'월 '+(+m[2])+'일 수정'+(it.dateSuffix?' · 그날 '+esc(it.dateSuffix)+'번째':'')+'</div>';
  }

  // 실제 홈페이지(아임웹)에 없는 것의 설명
  var NOLIVE={ 'coaching-payment-modal-demo':'코칭 페이지에서 신청하면 뜨는 창', 'imweb-header-code':'아임웹 설정에 붙이는 코드', 'imweb-footer-code':'아임웹 설정에 붙이는 코드', 'common-header':'모든 페이지 위쪽 메뉴', 'common-footer':'모든 페이지 아래쪽 정보' };

  function liveLine(it){
    if(it.liveUrl) return '<a class="addr" href="'+esc(it.liveUrl)+'" target="_blank" rel="noopener">'+esc(it.liveUrl.replace('https://',''))+' ↗</a>';
    if(!it.publicPath) return '';
    return '<div class="addr none">'+esc(NOLIVE[it.id]||'실제 홈페이지엔 아직 없어요')+'</div>';
  }
  function openBtns(it, workLabel){
    var b='';
    if(it.liveUrl) b+='<a class="btn live" href="'+esc(it.liveUrl)+'" target="_blank" rel="noopener">실제 페이지</a>';
    if(href(it)!==it.liveUrl) b+='<a class="btn" href="'+esc(href(it))+'" target="_blank" rel="noopener">'+esc(workLabel||(it.liveUrl||it.publicPath?'작업본':'열기'))+'</a>';
    if(it.imwebCode) b+='<button type="button" class="btn copy" data-copy="'+esc(it.imwebCode)+'">아임웹 코드 복사</button>';
    return b;
  }

  function pageCard(it, hist, note){
    if(!it) return '';
    var w=hist[hist.length-1];
    var stat = (it.id==='landing-page-v3' && w) ? '<div class="stat">최근 주 방문 <b>'+w.landing_visits+'명</b> · 구매 <b>'+(w.paid_customers||0)+'명</b></div>' : '';
    var where = WHERE[it.id] ? '<div class="where">'+esc(WHERE[it.id])+'</div>' : '';
    return '<div class="pg">'
      +(note? '<div class="when">'+esc(note)+'</div>' : '')
      +'<a class="name" href="'+esc(it.liveUrl||href(it))+'" target="_blank" rel="noopener">'+esc(it.title)+'</a>'
      +liveLine(it)
      +'<div class="desc">'+esc(it.description||'')+'</div>'+where+stat+dateLine(it)
      +'<div class="acts">'+openBtns(it)+'</div>'
      +'</div>';
  }

  function lane(title, cards, path){
    return '<div class="lane"><div class="lane-title">'+esc(title)+'</div><div class="lane-row'+(path?' path':'')+'">'
      +cards.filter(Boolean).join(path?'<span class="path-arrow" aria-hidden="true">→</span>':'')+'</div></div>';
  }

  function renderHomepage(hist){
    var html=LANES.map(function(l){
      return lane(l.title, l.ids.map(function(id){ return pageCard(byId[id],hist); }), l.path);
    }).join('');
    html+='<details class="later"><summary>준비 중인 페이지 '+LATER.length+'개</summary><div class="lane-row">'+LATER.map(function(id){ return pageCard(byId[id],hist); }).join('')+'</div></details>';
    document.getElementById('homepage').innerHTML=html;
  }

  document.addEventListener('click',function(e){
    var btn=e.target.closest('[data-copy]'); if(!btn||btn.disabled) return;
    var src=btn.getAttribute('data-copy'), label=btn.textContent;
    btn.disabled=true; btn.textContent='가져오는 중…';
    fetch('./'+src+'?t='+Date.now(),{cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
      .then(function(t){ return navigator.clipboard.writeText(t); })
      .then(function(){ btn.textContent='복사됐어요'; btn.classList.add('done'); })
      .catch(function(err){ console.error('[복사 실패]',src,err); btn.textContent='복사 실패'; btn.classList.add('fail'); })
      .then(function(){ setTimeout(function(){ btn.textContent=label; btn.classList.remove('done','fail'); btn.disabled=false; },2000); });
  });

  // ---------- 상담 ----------
  // 순서·발송 방법 정본: consulting-crm (07_후속문자.gs 3·30·90·180일, 12_알림톡.gs), nightwatch payment-guide-auto·consult-prep-auto·consult-chat-daily
  var JOURNEY=[
    {phase:'상담 전'},
    {when:'신청 직후', what:'결제 안내', how:'알림톡 · 자동', note:'10분 안에 결제 안 하면 카드결제 페이지 링크를 보내요', it:byId['coaching-payment']},
    {when:'일정 잡으면', what:'예약 확인 + 사전질문지 안내', how:'알림톡 · 자동', note:'손님이 구글 폼으로 사전질문지를 써요'},
    {when:'상담 이틀 전', what:'상담 PPT · 준비 메모', how:'자동으로 만들어짐', note:'손님별 PPT 사본이 생기고, 노션에 상담 준비 메모가 채워져요', it:byId['consult-ppt-template'], itNote:'PPT 원본 틀'},
    {when:'전날 · 당일', what:'상담 리마인드', how:'알림톡 · 자동', note:'상담 시간 알려 주는 안내'},
    {phase:'상담 당일 (사장님이 쓰는 것)'},
    {when:'상담 중', what:'상담 PPT', how:'화면 공유', note:'손님별 PPT를 보면서 진행해요'},
    {when:'필요할 때', what:'내집마련 계산기', how:'화면 공유', note:'매수가 · 월 상환액 · 갈아타기 계산', it:byId['consult-prep']},
    {when:'상담 중', what:'자산관리시트', how:'손님에게 줌', note:'손님이 계속 쓰는 실행 시트 (6탭)', it:byId['consult-asset-planner']},
    {phase:'상담 후'},
    {when:'상담 직후', what:'회원 맞춤 페이지', how:'링크 보냄', note:'상담 요약을 담은 손님별 페이지 (주소가 손님마다 달라요)', it:byId['consult-root']},
    {when:'3일 후', what:'내집마련 가이드', how:'알림톡 · 자동', note:'노션 문서', it:{title:'내집마련 가이드', href:'https://link.ourdongne.com/home-guide'}},
    {when:'7일 후', what:'안부 인사', how:'카톡 · 자동', note:'자료 없이 안부만 (못 보내면 10~12일에 다시)'},
    {when:'30일 후', what:'세금 가이드', how:'알림톡 · 자동', note:'노션 문서', it:{title:'세금 가이드', href:'https://link.ourdongne.com/tax-guide'}},
    {when:'90일 후', what:'추천도서', how:'알림톡 · 자동', note:'내집마련 독서 로드맵 15권', it:byId['recommended-books']},
    {when:'180일 후', what:'투자로드맵', how:'알림톡 · 자동', note:'투자 로드맵 + 노후 · 복리·은퇴 계산기', it:byId['consult-180day-column']}
  ];
  function renderConsult(){
    var html=JOURNEY.map(function(j){
      if(j.phase) return '<div class="jp">'+esc(j.phase)+'</div>';
      var acts='';
      if(j.it) acts=openBtns(j.it, j.itNote);
      var auto=j.how.indexOf('자동')>-1;
      return '<div class="jr">'
        +'<span class="j-when">'+esc(j.when)+'</span>'
        +'<div class="j-body"><b>'+esc(j.what)+'</b> <span class="j-how'+(auto?' auto':'')+'">'+esc(j.how)+'</span><div class="j-note">'+esc(j.note)+'</div>'+(j.it&&j.it.imwebDate?dateLine(j.it):'')+'</div>'
        +'<div class="j-acts">'+acts+'</div></div>';
    }).join('');
    document.getElementById('consult').innerHTML='<div class="journey">'+html+'</div>';
  }
  renderConsult();

  function linkCard(it){
    if(!it) return '';
    return '<a class="lk" href="'+esc(href(it))+'" target="_blank" rel="noopener"><b>'+esc(it.title)+'</b><span>'+esc(it.description||'')+'</span></a>';
  }
  document.getElementById('shortcuts').innerHTML=linkCard(byId['yt-bulk-editor']);
})();
</script>
