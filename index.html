<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <title>운영 대시보드 - 우리동네재테크</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; background: #F8FAFC; color: #1A1A1A; min-height: 100vh; }
        .hub { max-width: 1060px; margin: 0 auto; padding: 32px 20px; padding-right: 190px; }
        .header { margin-bottom: 28px; }
        h1 { font-size: 24px; font-weight: 800; color: #051C2C; margin-bottom: 4px; }
        .subtitle { color: #64748B; font-size: 14px; }
        .section { margin-bottom: 24px; }
        .section.dashed-top { border-top: 2px dashed #CBD5E1; padding-top: 28px; margin-top: 32px; }
        .section-title { width: 100%; min-height: 28px; padding: 0 0 8px; border-bottom: 1px solid #E2E8F0; font-size: 13px; font-weight: 850; color: #334155; letter-spacing: 0; margin-bottom: 10px; }
        .section-title span:last-child { display: inline-flex; align-items: center; }
        .section-icon { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 6px; background: transparent; color: inherit; font-size: 15px; line-height: 1; }
        .section-dashboard { --section-color: #1F2937; }
        .section-homepage-section { --section-color: #0077C8; }
        .section-consult { --section-color: #64748B; }
        .section-process { --section-color: #059669; }
        .section-tools { --section-color: #475569; }
        .section-archive { --section-color: #FF6B00; }
        .section-templates { --section-color: #1F2937; }
        details.section > summary.section-title { cursor: pointer; list-style: none; user-select: none; display: flex; align-items: center; gap: 7px; }
        details.section > summary.section-title::-webkit-details-marker { display: none; }
        details.section > summary.section-title::before { content: '▶'; font-size: 10px; color: #94A3B8; transition: transform 0.15s; }
        details.section[open] > summary.section-title::before { transform: rotate(90deg); }
        .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
        .group-label { font-size: 11px; font-weight: 700; color: #94A3B8; letter-spacing: 0.5px; padding: 14px 0 6px; text-transform: uppercase; }
        .group-label:first-child { padding-top: 4px; }
        .item { background: white; border: 1px solid #E2E8F0; border-radius: 10px; padding: 12px 14px; text-decoration: none; color: #1A1A1A; display: flex; align-items: center; gap: 11px; transition: all 0.15s; min-height: 58px; }
        .item:hover { border-color: #0077C8; }
        .item-icon { flex-shrink: 0; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
        .item-body { flex: 1; min-width: 0; }
        .item-title { display: block; font-size: 13px; font-weight: 750; color: #051C2C; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-desc { font-size: 12px; color: #94A3B8; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .badge { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; flex-shrink: 0; }
        .badge-live { background: #E8F3FF; color: #0077C8; }
        .badge-soon { background: #F1F5F9; color: #94A3B8; }
        .archive-meta { flex-shrink: 0; min-width: 68px; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; align-self: flex-start; margin-top: 7px; }
        .archive-chip { display: inline-flex; align-items: center; width: fit-content; border-radius: 999px; padding: 1px 6px; background: #0F172A; color: #FFFFFF; font-size: 9px; font-weight: 800; line-height: 1.35; }
        .date-chip { display: inline-flex; align-items: center; width: fit-content; border-radius: 999px; padding: 1px 6px; background: #F1F5F9; color: #8090AA; font-size: 9px; font-weight: 700; line-height: 1.35; }
        .arrow { color: #CBD5E1; font-size: 16px; flex-shrink: 0; }
        .sheet { overflow: hidden; border: 1px solid #D8E0EA; border-radius: 8px; background: #FFFFFF; }
        .sheet-row { display: grid; grid-template-columns: 38px 72px 106px minmax(150px, 1.1fr) minmax(160px, 1.4fr) 68px; min-height: 34px; color: #1A1A1A; text-decoration: none; border-top: 1px solid #E8EEF5; }
        .sheet-row:first-child { border-top: 0; }
        .sheet-row:hover:not(.sheet-head) { background: #F8FBFF; }
        .sheet-head { min-height: 30px; background: #F4F7FB; color: #64748B; font-size: 11px; font-weight: 800; letter-spacing: 0.02em; }
        .sheet-head .sheet-cell { cursor: pointer; user-select: none; }
        .sheet-head .sheet-cell:hover { background: #EAF0F7; color: #334155; }
        .sheet-cell { display: flex; align-items: center; min-width: 0; padding: 7px 9px; font-size: 12px; line-height: 1.3; }
        .sheet-star { justify-content: center; padding-left: 5px; padding-right: 5px; }
        .star-btn { width: 26px; height: 26px; border-radius: 999px; color: #CBD5E1; display: inline-flex; align-items: center; justify-content: center; font-size: 21px; line-height: 1; cursor: pointer; user-select: none; }
        .star-btn:hover { background: #FFF7ED; color: #F59E0B; }
        .star-btn.active { color: #F59E0B; text-shadow: 0 1px 0 rgba(146,64,14,.14); }
        .sheet-no { justify-content: center; }
        .sheet-no .archive-chip { font-size: 9px; }
        .sheet-group { color: #64748B; font-weight: 750; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sheet-date { color: #8090AA; font-weight: 700; }
        .sheet-title { color: #051C2C; font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sheet-desc { color: #8090AA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sheet-status { justify-content: center; }
        .generic-sheet .sheet-row { grid-template-columns: 38px 112px minmax(160px, 1.1fr) minmax(220px, 1.6fr) 70px; }

        @media (max-width: 1200px) { .hub { padding-right: 20px; } }
        @media (max-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 760px) {
            .sheet-row { grid-template-columns: 34px 62px 92px minmax(130px, 1fr) 56px; }
            .generic-sheet .sheet-row { grid-template-columns: 34px 92px minmax(130px, 1fr) 56px; }
            .sheet-desc { display: none; }
            .sheet-cell.desc-col { display: none; }
            .sheet-cell.group-col { display: flex; }
        }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="hub">
        <div class="header">
            <h1>운영 대시보드</h1>
            <p class="subtitle">우리동네재테크</p>
        </div>
        <div id="hub-sections"></div>
    </div>
<script src="./site-config.js"></script>
<script>
(function() {
    var site = window.DASHBOARD_SITE;
    var container = document.getElementById('hub-sections');
    if (!site || !container) {
        return;
    }

    var sheetSort = {};
    var starred = loadStars();
    container.innerHTML = site.sections.map(renderSection).join('');
    container.addEventListener('click', function(event) {
        var star = event.target.closest('[data-star-key]');
        if (star) {
            event.preventDefault();
            toggleStar(star.getAttribute('data-star-key'));
            return;
        }
        var cell = event.target.closest('[data-sheet-sort]');
        if (!cell) {
            return;
        }
        event.preventDefault();
        var sectionId = cell.getAttribute('data-section-id');
        var key = cell.getAttribute('data-sheet-sort');
        var current = sheetSort[sectionId] || {};
        sheetSort[sectionId] = {
            key: key,
            dir: current.key === key && current.dir === 'asc' ? 'desc' : 'asc'
        };
        container.innerHTML = site.sections.map(renderSection).join('');
    });

    function renderSection(section) {
        var items = section.items.filter(function(item) { return item.hubVisible; });
        if (!items.length && !section.alwaysVisible) {
            return '';
        }
        var sectionClass = (section.dashedTop ? 'section dashed-top' : 'section') + ' section-' + section.id;
        var body = renderBody(items, section);
        if (section.collapsible) {
            var openAttr = section.defaultOpen ? ' open' : '';
            return ''
                + '<details class="' + sectionClass + '"' + openAttr + '>'
                + '<summary class="section-title">' + renderSectionIcon(section) + '<span>' + esc(section.hubTitle) + '</span></summary>'
                + body
                + '</details>';
        }
        return ''
            + '<div class="' + sectionClass + '">'
            + '<div class="section-title">' + renderSectionIcon(section) + '<span>' + esc(section.hubTitle) + '</span></div>'
            + body
            + '</div>';
    }

    function renderSectionIcon(section) {
        var iconMap = {
            dashboard: '📊',
            'homepage-section': '🏠',
            consult: '💬',
            templates: '📄',
            process: '🔁',
            tools: '🛠️',
            archive: '🗂️',
            temp: '🧪'
        };
        return '<span class="section-icon">' + esc(iconMap[section.id] || '•') + '</span>';
    }

    function renderBody(items, section) {
        return renderSheet(items, section.id);
    }

    function renderSheet(items, sectionId) {
        var isArchive = items.some(function(item) { return item.archiveNo || item.modifiedDate; });
        var head = isArchive ? renderArchiveHead(sectionId) : renderGenericHead(sectionId);
        var className = isArchive ? 'sheet archive-sheet' : 'sheet generic-sheet';
        return '<div class="' + className + '">' + head + sortSheetItems(items, sectionId).map(function(item) {
            return isArchive ? renderArchiveSheetItem(item) : renderGenericSheetItem(item);
        }).join('') + '</div>';
    }

    function renderArchiveHead(sectionId) {
        return ''
            + '<div class="sheet-row sheet-head">'
            + '<div class="sheet-cell sheet-star"></div>'
            + '<div class="sheet-cell sheet-no" data-sheet-sort="archiveNo" data-section-id="' + esc(sectionId) + '">번호</div>'
            + '<div class="sheet-cell" data-sheet-sort="modifiedDate" data-section-id="' + esc(sectionId) + '">수정일</div>'
            + '<div class="sheet-cell" data-sheet-sort="title" data-section-id="' + esc(sectionId) + '">제목</div>'
            + '<div class="sheet-cell desc-col" data-sheet-sort="description" data-section-id="' + esc(sectionId) + '">설명</div>'
            + '<div class="sheet-cell sheet-status" data-sheet-sort="badgeText" data-section-id="' + esc(sectionId) + '">상태</div>'
            + '</div>';
    }

    function renderGenericHead(sectionId) {
        return ''
            + '<div class="sheet-row sheet-head">'
            + '<div class="sheet-cell sheet-star"></div>'
            + '<div class="sheet-cell group-col" data-sheet-sort="groupLabel" data-section-id="' + esc(sectionId) + '">구분</div>'
            + '<div class="sheet-cell" data-sheet-sort="title" data-section-id="' + esc(sectionId) + '">이름</div>'
            + '<div class="sheet-cell desc-col" data-sheet-sort="description" data-section-id="' + esc(sectionId) + '">설명</div>'
            + '<div class="sheet-cell sheet-status" data-sheet-sort="badgeText" data-section-id="' + esc(sectionId) + '">상태</div>'
            + '</div>';
    }

    function sortSheetItems(items, sectionId) {
        var state = sheetSort[sectionId];
        if (!state && sectionId === 'archive') {
            state = { key: 'modifiedDate', dir: 'desc' };
        }
        if (!state || !state.key) {
            return items;
        }
        return items.slice().sort(function(a, b) {
            var av = String(a[state.key] || '');
            var bv = String(b[state.key] || '');
            var result = av.localeCompare(bv, 'ko', { numeric: true, sensitivity: 'base' });
            return state.dir === 'desc' ? -result : result;
        });
    }

    function renderArchiveSheetItem(item) {
        var badgeClass = item.badgeTone === 'soon' ? 'badge-soon' : 'badge-live';
        var href = item.href.indexOf('http') === 0 ? item.href : './' + item.href;
        return ''
            + '<a href="' + href + '" class="sheet-row" target="_blank" rel="noopener">'
            + starCell(item)
            + '<div class="sheet-cell sheet-no">' + (item.archiveNo ? '<span class="archive-chip">' + esc(item.archiveNo) + '</span>' : '<span class="badge ' + badgeClass + '">' + esc(item.badgeText || '') + '</span>') + '</div>'
            + '<div class="sheet-cell sheet-date">' + esc(item.modifiedDate || '-') + '</div>'
            + '<div class="sheet-cell sheet-title">' + esc(item.title) + '</div>'
            + '<div class="sheet-cell sheet-desc desc-col">' + esc(item.description || '') + '</div>'
            + '<div class="sheet-cell sheet-status"><span class="badge ' + badgeClass + '">' + esc(item.badgeText || '') + '</span></div>'
            + '</a>';
    }

    function renderGenericSheetItem(item) {
        var badgeClass = item.badgeTone === 'soon' ? 'badge-soon' : 'badge-live';
        var href = item.href.indexOf('http') === 0 ? item.href : './' + item.href;
        var group = item.groupLabel || item.sidebarLabel || '기타';
        return ''
            + '<a href="' + href + '" class="sheet-row" target="_blank" rel="noopener">'
            + starCell(item)
            + '<div class="sheet-cell sheet-group group-col">' + esc(group) + '</div>'
            + '<div class="sheet-cell sheet-title">' + esc(item.title) + '</div>'
            + '<div class="sheet-cell sheet-desc desc-col">' + esc(item.description || '') + '</div>'
            + '<div class="sheet-cell sheet-status"><span class="badge ' + badgeClass + '">' + esc(item.badgeText || '') + '</span></div>'
            + '</a>';
    }

    function starCell(item) {
        var key = starKey(item);
        var on = !!starred[key];
        return '<div class="sheet-cell sheet-star"><span class="star-btn ' + (on ? 'active' : '') + '" role="button" tabindex="0" data-star-key="' + attr(key) + '" aria-label="' + (on ? '별표 해제' : '별표 표시') + '">' + (on ? '★' : '☆') + '</span></div>';
    }

    function toggleStar(key) {
        if (starred[key]) {
            delete starred[key];
        } else {
            starred[key] = true;
        }
        saveStars();
        container.innerHTML = site.sections.map(renderSection).join('');
    }

    function loadStars() {
        try {
            return JSON.parse(localStorage.getItem('hubDashboardStars') || '{}') || {};
        } catch (error) {
            return {};
        }
    }

    function saveStars() {
        try {
            localStorage.setItem('hubDashboardStars', JSON.stringify(starred));
        } catch (error) {}
    }

    function starKey(item) {
        return [item.href || '', item.title || '', item.groupLabel || item.sidebarLabel || ''].map(function(value) {
            return String(value).trim().toLowerCase().replace(/\s+/g, ' ');
        }).join('|');
    }

    function esc(value) {
        var el = document.createElement('span');
        el.textContent = value;
        return el.innerHTML;
    }

    function attr(value) {
        return esc(value).replace(/"/g, '&quot;');
    }
})();
</script>
<script src="./nav.js"></script>
<script src="./sidebar.js"></script>
<script src="./footer.js"></script>
</body>
</html>
