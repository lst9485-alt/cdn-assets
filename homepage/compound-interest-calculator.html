<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>복리계산기 - 우리동네재테크</title>
  <meta name="description" content="예금식·적금식으로 복리·단리 수익을 계산하는 한국형 복리계산기">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <link rel="stylesheet" href="compound-interest-calculator.css?v=20260623i">
</head>
<body>
  <main class="ci-page">
    <nav class="calc-tabs" aria-label="계산기 선택">
      <a href="fire-retirement-calculator.html">은퇴계산기</a>
      <a href="compound-interest-calculator.html" class="active" aria-current="page">복리계산기</a>
    </nav>
    <section class="hero">
      <a class="back-link" href="../index.html">← 도구 목록으로 돌아가기</a>
      <h1>복리계산기</h1>
      <p class="assumption-note">세금, 수수료, 물가상승률은 반영하지 않습니다.</p>
    </section>

    <section class="calculator" id="calculator">
      <form class="input-panel" id="inputForm">
        <section class="input-card" id="inputCard">
          <h2>원금과 매달 적립</h2>

          <label class="ly-field">
            <span>원금</span>
            <div class="value-box">
              <input id="principal" type="text" inputmode="decimal" value="1,000">
              <em>만원</em>
            </div>
          </label>

          <label class="ly-field">
            <span>월 적립액</span>
            <div class="value-box">
              <input id="monthly" type="text" inputmode="decimal" value="0">
              <em>만원</em>
            </div>
          </label>

          <div class="ly-field slider-field rate-row">
            <span class="rate-name">연 수익률</span>
            <div class="mode-toggle" role="group" aria-label="이자 방식">
              <button type="button" class="mode-btn active" data-mode="compound" aria-pressed="true">복리</button>
              <button type="button" class="mode-btn" data-mode="simple" aria-pressed="false">단리</button>
            </div>
            <input id="annualRateRange" type="range" min="0" max="30" step="0.1" value="5" aria-label="연 수익률 조정">
            <div class="value-box compact">
              <input id="annualRate" type="number" min="0" max="30" step="0.1" value="5" aria-label="연 수익률">
              <em>%</em>
            </div>
          </div>

          <label class="ly-field slider-field">
            <span>기간</span>
            <input id="yearsRange" type="range" min="1" max="50" step="1" value="10">
            <div class="value-box compact">
              <input id="years" type="number" min="1" max="50" step="1" value="10">
              <em>년</em>
            </div>
          </label>

          <div class="button-row">
            <button type="button" class="secondary-button" id="resetInputs">초기화</button>
            <button type="button" class="primary-button" id="copyShare">링크 공유</button>
          </div>
        </section>
      </form>

      <section class="result-hero" aria-live="polite">
        <span class="result-kicker" id="resultKicker">10년 뒤</span>
        <strong id="finalAmount">1,629만원</strong>
        <p id="resultSummary">불어난 돈 629만원 · 원금의 1.6배</p>
      </section>

      <section class="projection-shell">
        <div class="projection-card" id="projectionCard">
          <h2 id="chartTitle">원금이 불어나는 모습</h2>

          <div class="chart-tabs" role="tablist" aria-label="결과 보기 선택">
            <button type="button" class="active" data-projection-view="chart">차트</button>
            <button type="button" data-projection-view="table">표</button>
          </div>

          <div class="chart-wrap" id="chartView">
            <canvas id="compoundChart"></canvas>
          </div>

          <div class="chart-foot">
            <p id="insightCard"></p>
            <button type="button" class="secondary-button share-bottom" id="copyShareTop">공유</button>
          </div>

          <div class="table-panel" id="tablePanel">
            <div class="table-title">
              <div>
                <span>연도별 상세표</span>
                <strong>평가액 = 납입액 + 이자누계. 단위: 만원</strong>
              </div>
              <button class="secondary-button table-toggle" type="button" id="toggleRows">전체 연도 보기</button>
            </div>

            <div class="table-wrap" id="tableView">
              <table>
                <thead>
                  <tr>
                    <th>연차</th>
                    <th>넣은 돈</th>
                    <th>이자누계</th>
                    <th>평가액</th>
                  </tr>
                </thead>
                <tbody id="projectionTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="compound-interest-calculator.js?v=20260623e"></script>
  <script src="homepage-shell.js?v=20260506d"></script>
</body>
</html>
