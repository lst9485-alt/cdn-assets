<style>

  .stamp {

  .applicant-plain {

    line-height: 1.55;

  .applicant-plain p {

  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; }

  .dashed { border-top: 1.5px dashed #d1d5db; border-bottom: 1.5px dashed #d1d5db; }
  .footer-info {

  .footer-info .biz p { margin: 0; font-size: 11px; color: #9ca3af; line-height: 1.5; }

  .bank-info { margin-top: 10px; padding: 10px 12px; background: #ffffff; border-radius: 12px; }
  .bank-info .b1 { font-size: 12px; color: #9ca3af; font-weight: 700; }
  .bank-info .b2 { font-family: 'GmarketSans', Pretendard, sans-serif; font-weight: 900; font-size: 18px; color: #0a1638; margin-top: 4px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .bank-info .b3 { font-size: 14px; color: #111111; font-weight: 800; margin-top: 4px; }
  .copy-btn {

  .copy-btn:hover { background: #1747d4; }
  .copy-btn:active { transform: scale(.96); }
  .copy-btn.is-copied { background: #16a34a; }

  .pay-bank-full {

  .pay-bank-full h4 {

    font-weight: 900;
    font-size: 17px;
    color: #0a1638;
    margin-bottom: 12px;
  }
  .pay-bank-full .bank-info { margin-top: 0; padding: 12px 14px; }
  .pay-bank-full .b2 { font-size: 20px; }
  .pay-bank-full .note {
    margin-top: 10px;
    font-size: 12.5px;
    color: #475569;
    font-weight: 600;
    line-height: 1.55;
  }
  .pay-bank-full .note strong { color: #0a1638; font-weight: 900; }

  .card-link-subtle {
    margin-top: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px;
    border: 1.5px dashed #cbd5e1;
    border-radius: 10px;
    color: #475569;
    font-family: Pretendard, sans-serif;
    font-size: 13.5px;
    font-weight: 700;
    background: #ffffff;
    text-decoration: none;
  }
  .card-link-subtle:hover { border-color: #1747d4; background: #f6f9ff; }
  .card-link-subtle .left { display: flex; align-items: center; gap: 8px; }
  .card-link-subtle .left strong { color: #0a1638; font-weight: 900; }
  .card-link-subtle .right { display: inline-flex; align-items: center; gap: 4px; color: #1747d4; font-weight: 900; }
  .card-link-subtle .sub { display: block; font-size: 11.5px; color: #94a3b8; font-weight: 600; margin-top: 2px; }

  /* ===== 모바일 ===== */
  @media (max-width: 820px) {
    .modal-overlay { padding: 24px 12px; }
    .modal-close { top: -38px; }
    .receipt { padding: 24px 20px 20px; border-radius: 14px; }
    .receipt h1 { font-size: 28px !important; }
    .receipt-top { grid-template-columns: 1fr auto; gap: 12px; }
    .receipt-top-right { text-align: right; }
    .applicant-plain { text-align: right; }
    .stamp { font-size: 11px; letter-spacing: 0.24em; padding: 3px 8px; }
    .brand { font-size: 12px; }
    .applicant-plain p { font-size: 11.5px; }
    .applicant-plain .ap-value { font-size: 12px; }
    .row { gap: 12px; }
    .row dt { font-size: 13px; }
    .pay-bank-full { padding: 16px 14px; }
    .pay-bank-full .b2 { font-size: 14.5px; }
    .copy-btn { padding: 3px 7px; font-size: 10.5px; }
    .copy-btn iconify-icon { font-size: 11px; }
    .card-link-subtle {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      padding: 14px 16px;
      text-align: center;
    }
    .card-link-subtle .left {
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .card-link-subtle .left strong { font-size: 13px; }
    .card-link-subtle .left .sub { font-size: 11.5px; margin-top: 0; }
    .card-link-subtle .right {
      justify-content: center;
      background: #1747d4;
      color: #ffffff;
      padding: 11px;
      border-radius: 8px;
      font-size: 13.5px;
    }
    .card-link-subtle .right iconify-icon { color: #ffffff; }
    .footer-info { flex-direction: column; align-items: flex-start; gap: 6px; }
    .footer-info .biz p { font-size: 10.5px; }
    dl[style*="font-size:14px"] dd[style*="font-size:28px"] { font-size: 24px !important; }

</style>
</head>
<body>

  <!-- 신청 폼 제거됨 — 페이지 로드 시 모달 자동 표시 -->

  <!-- ===== 결제 안내 모달 ===== -->
  <div class="modal-overlay" id="payment-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-shell">
      <button type="button" class="modal-close" id="modal-close-btn" aria-label="닫기">×</button>
      <div class="receipt-wrap">
        <div class="receipt">
          <div class="receipt-top">
            <div class="receipt-top-left">
              <span class="stamp">주문결제</span>
              <h1 id="modal-title" class="font-display font-black leading-none text-brand-dark word-keep" style="font-size: 40px; margin-top: 22px;">신청 접수 완료</h1>
              <p class="mt-3 text-sm text-gray-500 font-medium word-keep">아래 안내대로 결제를 진행해주세요.<br/>결제 완료 시 일정예약 카톡이 발송됩니다.</p>
            </div>
            <div class="receipt-top-right">
              <p class="brand">우리동네재테크</p>
              <div class="applicant-plain">
                <p><span class="ap-label">신청자</span><span class="ap-value" data-name>홍길동</span></p>
                <p><span class="ap-label">연락처</span><span class="ap-value" data-phone>010-1234-5678</span></p>
              </div>
            </div>
          </div>

          <dl class="dashed py-3 space-y-1.5 mt-5" style="font-size:14px;">
            <div class="row">
              <dt>상품</dt>
              <dd class="font-display font-black text-brand-dark" style="font-size:17px;">코칭 A</dd>
            </div>
            <div class="row">
              <dt>결제 금액</dt>
              <dd class="font-display font-black text-brand-blue" style="font-size:28px;">400,000원</dd>
            </div>
          </dl>

          <div class="pay-bank-full">
            <h4>무통장 입금</h4>
            <div class="bank-info">
              <p class="b1">
                입금 계좌
                <span style="display:inline-block; margin-left:6px; padding:3px 8px; border-radius:5px; background:#dbeafe; color:#1d4ed8; font-size:11px; font-weight:800; letter-spacing:0.02em;">현금영수증 발행</span>
              </p>
              <p class="b2">
                <span>하나은행 125-910032-26304</span>
                <button type="button" class="copy-btn" data-copy="125-910032-26304" aria-label="계좌번호 복사">
                  <iconify-icon icon="solar:copy-linear"></iconify-icon>
                  복사
                </button>
              </p>
              <p class="b3">주식회사 우리동네사람들</p>
            </div>
          </div>

          <a href="https://ourdongne.com/coaching-pay" target="_blank" rel="noopener" class="card-link-subtle">
            <span class="left">
              <span class="sub">BC · 삼성 · 현대카드 제외</span>
            </span>
            <span class="right">
              카드결제 하러가기
              <iconify-icon icon="solar:arrow-right-linear" width="16" height="16"></iconify-icon>
            </span>
          </a>

          <div class="footer-info" style="margin-top:18px;">
            <div class="biz">
              <p>(주)우리동네사람들 · 사업자등록번호 386-86-03832</p>
              <p>통신판매신고번호 제 2026-서울영등포-0991 호</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var modal = document.getElementById('payment-modal');
      var closeBtn = document.getElementById('modal-close-btn');

      function openModal(name, phone) {
        modal.querySelectorAll('[data-name]').forEach(function (el) { el.textContent = name || '신청자'; });
        modal.querySelectorAll('[data-phone]').forEach(function (el) { el.textContent = phone || '-'; });
        modal.classList.add('is-open');
        document.body.style.overflow = 'hidden';
      }
      function closeModal() {
        modal.classList.remove('is-open');
        document.body.style.overflow = '';
      }

      // 페이지 로드 시 자동으로 모달 표시 (데모 미리보기용)
      openModal('홍길동', '010-1234-5678');

      closeBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', function (e) {
        if (e.target === modal) closeModal();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && modal.classList.contains('is-open')) closeModal();
      });

      // 복사 버튼
      document.addEventListener('click', function (e) {
        var btn = e.target.closest('.copy-btn');
        if (!btn) return;
        var text = btn.getAttribute('data-copy') || '';
        var done = function () {
          var orig = btn.innerHTML;
          btn.classList.add('is-copied');
          btn.innerHTML = '<iconify-icon icon="solar:check-circle-bold"></iconify-icon> 복사됨';
          setTimeout(function () {
            btn.classList.remove('is-copied');
            btn.innerHTML = orig;
          }, 1600);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(function () {
            var ta = document.createElement('textarea');
            ta.value = text; document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); done(); } catch (err) {}
            document.body.removeChild(ta);
          });
        } else {
          var ta = document.createElement('textarea');
          ta.value = text; document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); done(); } catch (err) {}
          document.body.removeChild(ta);
        }
      });
    })();
  </script>
</body>
</html>
