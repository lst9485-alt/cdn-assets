<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>1:1 코칭 알림톡 영수증 이미지 — 우리동네 재테크</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Pretendard', 'system-ui', '-apple-system', 'sans-serif'],
          display: ['"GmarketSans"', 'Pretendard', 'sans-serif'],
        },
        colors: {
          brand: { orange: '#FF6B00', blue: '#0055FF', dark: '#111111' }
        }
      }
    }
  }
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/AceDev-Labs/GmarketSans/GmarketSans.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Pretendard, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #eef3ff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .alimtalk-card {
    width: 800px;
    height: 400px;
    background: #ffffff;
    border-radius: 28px;
    padding: 52px 60px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 24px 80px rgba(0, 85, 255, .10);
  }
  .word-keep { word-break: keep-all; overflow-wrap: break-word; }
</style>
</head>
<body>
  <div class="alimtalk-card" id="card">
    <div>
      <p class="text-sm font-bold tracking-[0.18em] text-brand-blue">우리동네재테크 · 1:1 코칭 신청 영수증</p>
      <h1 class="mt-4 font-display text-6xl font-black leading-none text-brand-dark word-keep">신청 접수 완료</h1>
      <p class="mt-4 text-base leading-7 text-gray-500 word-keep">결제 확인 후 카카오톡으로 사전질문지를 보내드립니다.</p>
    </div>
    <dl class="border-t border-b border-dashed border-gray-300 py-5">
      <div class="flex items-baseline justify-between gap-6">
        <dt class="text-base text-gray-500">상품</dt>
        <dd class="font-display text-2xl font-black text-brand-dark">내집마련 1:1 코칭 A</dd>
      </div>
      <div class="mt-3 flex items-baseline justify-between gap-6">
        <dt class="text-base text-gray-500">결제 금액</dt>
        <dd class="font-display text-4xl font-black text-brand-blue">400,000원</dd>
      </div>
    </dl>
  </div>
</body>
</html>
