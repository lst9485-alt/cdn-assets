<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>알림톡 영수증 시안 — 우리동네 재테크</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Pretendard', 'system-ui', '-apple-system', 'sans-serif'],
          display: ['"GmarketSans"', 'Pretendard', 'sans-serif'],
        },
        colors: {
          brand: { orange: '#FF6B00', blue: '#0055FF', dark: '#111111' }
        }
      }
    }
  }
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/AceDev-Labs/GmarketSans/GmarketSans.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Pretendard, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #eef3ff;
    padding: 40px 0;
  }
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
  }
  .label {
    width: 800px;
    font-family: 'GmarketSans', Pretendard, sans-serif;
    font-weight: 900;
    font-size: 14px;
    letter-spacing: 0.18em;
    color: #0055FF;
    text-transform: uppercase;
  }
  .alimtalk-card {
    width: 800px;
    height: 400px;
    background: #ffffff;
    border-radius: 28px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    box-shadow: 0 24px 80px rgba(0, 85, 255, .10);
  }
  .card-a { padding: 56px 64px; }
  .card-b { padding: 44px 56px; }
  .word-keep { word-break: keep-all; overflow-wrap: break-word; }
</style>
</head>
<body>
  <div class="stage">
    <p class="label">A · 영수증만</p>
    <div class="alimtalk-card card-a" id="card-a">
      <div>
        <p class="font-display text-lg font-black text-brand-blue">우리동네재테크</p>
        <h1 class="mt-3 font-display font-black leading-none text-brand-dark word-keep" style="font-size: 80px;">신청 접수 완료</h1>
      </div>
      <dl class="border-t border-b border-dashed border-gray-300 py-5">
        <div class="flex items-baseline justify-between gap-6">
          <dt class="text-lg text-gray-500">상품</dt>
          <dd class="font-display text-2xl font-black text-brand-dark">내집마련 1:1 코칭 A</dd>
        </div>
        <div class="mt-3 flex items-baseline justify-between gap-6">
          <dt class="text-lg text-gray-500">결제 금액</dt>
          <dd class="font-display text-4xl font-black text-brand-blue">400,000원</dd>
        </div>
      </dl>
    </div>

    <p class="label">B · 영수증 + 계좌</p>
    <div class="alimtalk-card card-b" id="card-b">
      <div>
        <p class="font-display text-base font-black text-brand-blue">우리동네재테크</p>
        <h1 class="mt-2 font-display font-black leading-none text-brand-dark word-keep" style="font-size: 56px;">신청 접수 완료</h1>
      </div>

      <dl class="border-t border-b border-dashed border-gray-300 py-4">
        <div class="flex items-baseline justify-between gap-6">
          <dt class="text-base text-gray-500">상품</dt>
          <dd class="font-display text-xl font-black text-brand-dark">내집마련 1:1 코칭 A</dd>
        </div>
        <div class="mt-2 flex items-baseline justify-between gap-6">
          <dt class="text-base text-gray-500">결제 금액</dt>
          <dd class="font-display text-3xl font-black text-brand-blue">400,000원</dd>
        </div>
      </dl>

      <div>
        <p class="text-xs font-bold tracking-[0.18em] text-gray-400">무통장 입금 계좌</p>
        <div class="mt-1 flex items-baseline justify-between gap-6">
          <p class="font-display text-2xl font-black text-brand-dark">하나은행 125-910032-26304</p>
          <p class="text-sm text-gray-500">예금주 · 주식회사 우리동네사람들</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
