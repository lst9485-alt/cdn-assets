<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>알림톡 영수증 시안 — 우리동네 재테크</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Pretendard', 'system-ui', '-apple-system', 'sans-serif'],
          display: ['"GmarketSans"', 'Pretendard', 'sans-serif'],
        },
        colors: {
          brand: { orange: '#FF6B00', blue: '#0055FF', dark: '#111111' }
        }
      }
    }
  }
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/AceDev-Labs/GmarketSans/GmarketSans.css">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Pretendard, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #eef3ff;
    padding: 48px 0;
  }
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
  }
  .label {
    width: 800px;
    font-family: 'GmarketSans', Pretendard, sans-serif;
    font-weight: 900;
    font-size: 14px;
    letter-spacing: 0.18em;
    color: #0055FF;
  }
  .receipt-wrap {
    width: 800px;
    filter: drop-shadow(0 24px 60px rgba(0, 85, 255, .12));
  }
  .receipt {
    width: 800px;
    height: 400px;
    background: #ffffff;
    box-sizing: border-box;
    --notch: 14px;
    -webkit-mask:
      radial-gradient(var(--notch) at 50% 0, transparent 98%, #000 100%) 50% 0/28px var(--notch) repeat-x,
      radial-gradient(var(--notch) at 50% 100%, transparent 98%, #000 100%) 50% 100%/28px var(--notch) repeat-x,
      linear-gradient(#000, #000);
    mask:
      radial-gradient(var(--notch) at 50% 0, transparent 98%, #000 100%) 50% 0/28px var(--notch) repeat-x,
      radial-gradient(var(--notch) at 50% 100%, transparent 98%, #000 100%) 50% 100%/28px var(--notch) repeat-x,
      linear-gradient(#000, #000);
    padding: 40px 64px 36px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .receipt-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .stamp {
    font-family: 'GmarketSans', Pretendard, sans-serif;
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 0.32em;
    color: #0055FF;
    padding: 4px 10px;
    border: 2px solid #0055FF;
    border-radius: 4px;
  }
  .brand {
    font-family: 'GmarketSans', Pretendard, sans-serif;
    font-weight: 900;
    font-size: 14px;
    color: #6b7280;
  }
  .word-keep { word-break: keep-all; overflow-wrap: break-word; }
  .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
  }
  .row dt { color: #6b7280; font-size: 14px; }
  .dashed { border-top: 1.5px dashed #d1d5db; border-bottom: 1.5px dashed #d1d5db; }
</style>
</head>
<body>
  <div class="stage">
    <p class="label">A · 영수증만</p>
    <div class="receipt-wrap">
      <div class="receipt" id="card-a">
        <div class="receipt-head">
          <span class="stamp">영수증</span>
          <p class="brand">우리동네재테크</p>
        </div>
        <h1 class="font-display font-black leading-none text-brand-dark word-keep" style="font-size: 64px;">신청 접수 완료</h1>
        <dl class="dashed py-5 space-y-3">
          <div class="row">
            <dt>상품</dt>
            <dd class="font-display text-2xl font-black text-brand-dark">내집마련 1:1 코칭 A</dd>
          </div>
          <div class="row">
            <dt>결제 금액</dt>
            <dd class="font-display text-4xl font-black text-brand-blue">400,000원</dd>
          </div>
        </dl>
      </div>
    </div>

    <p class="label">B · 영수증 + 계좌</p>
    <div class="receipt-wrap">
      <div class="receipt" id="card-b" style="padding: 36px 56px 32px;">
        <div class="receipt-head">
          <span class="stamp">영수증</span>
          <p class="brand">우리동네재테크</p>
        </div>
        <h1 class="font-display font-black leading-none text-brand-dark word-keep" style="font-size: 48px;">신청 접수 완료</h1>
        <dl class="dashed py-4 space-y-2">
          <div class="row">
            <dt>상품</dt>
            <dd class="font-display text-xl font-black text-brand-dark">내집마련 1:1 코칭 A</dd>
          </div>
          <div class="row">
            <dt>결제 금액</dt>
            <dd class="font-display text-3xl font-black text-brand-blue">400,000원</dd>
          </div>
        </dl>
        <div class="row">
          <dt>입금 계좌</dt>
          <div style="text-align:right;">
            <p class="font-display text-xl font-black text-brand-dark">하나은행 125-910032-26304</p>
            <p style="font-size:12px; color:#6b7280; margin-top:2px;">예금주 · 주식회사 우리동네사람들</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
