<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>계산기 그래프 비교 — 지금 vs 바꾼 안</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #F5F0E8; color: #1a1a1a; font-family: Pretendard, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: 24px; font-weight: 900; margin: 0 0 6px; text-align: center; }
    .sub { text-align: center; color: #6b6158; margin: 0 0 28px; font-size: 15px; }
    h2 { font-size: 18px; font-weight: 800; margin: 36px 0 12px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 760px) { .row { grid-template-columns: 1fr; } }
    .card { background: #fff; border-radius: 20px; padding: 18px 18px 14px; box-shadow: 0 12px 30px rgba(26,26,26,.06); }
    .tag { display: inline-block; font-size: 13px; font-weight: 800; padding: 4px 12px; border-radius: 999px; margin-bottom: 10px; }
    .tag.old { background: #eee7dc; color: #6b6158; }
    .tag.new { background: #FF6B00; color: #fff; }
    .box { position: relative; height: 300px; }
    .note { font-size: 13px; color: #6b6158; margin: 10px 2px 0; line-height: 1.6; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>계산기 그래프 비교</h1>
  <p class="sub">왼쪽이 지금 그래프, 오른쪽이 바꾼 안입니다. 숫자는 같고 모양만 다릅니다.</p>

  <h2>복리계산기 · 1,000만원을 연 5%로 10년</h2>
  <div class="row">
    <div class="card"><span class="tag old">지금</span><div class="box"><canvas id="c1old"></canvas></div>
      <p class="note">해마다 점 + 선 아래 색 채우기 + 점선 비교선 + 아래 범례</p></div>
    <div class="card"><span class="tag new">바꾼 안</span><div class="box"><canvas id="c1new"></canvas></div>
      <p class="note">점 없이 굵은 선 하나, 마지막에만 금액 표시, 비교선은 연한 실선에 이름 바로 붙임</p></div>
  </div>

  <h2>은퇴계산기 · 35세, 연 2,400만원 저축, 연 5%</h2>
  <div class="row">
    <div class="card"><span class="tag old">지금</span><div class="box"><canvas id="c2old"></canvas></div>
      <p class="note">해마다 점 + 색 채우기 + 점선 비교선 + 초록 점선 목표</p></div>
    <div class="card"><span class="tag new">바꾼 안</span><div class="box"><canvas id="c2new"></canvas></div>
      <p class="note">목표선은 연한 실선, 닿는 지점에만 점 하나 + "53세 도달"</p></div>
  </div>
</div>

<script>
  var ORANGE = '#FF6B00', INK = '#1a1a1a', MUTED = '#6b6158', SOFT = '#c9bdb0';
  function man(v) {
    if (v >= 10000) { var e = v / 10000; return (Math.round(e * 10) / 10) + '억'; }
    return Math.round(v).toLocaleString() + '만';
  }

  // 데이터
  var y1 = [], put1 = [], grow1 = [];
  for (var i = 0; i <= 10; i++) { y1.push(i + '년'); put1.push(1000); grow1.push(Math.round(1000 * Math.pow(1.05, i))); }
  var y2 = [], save2 = [], inv2 = [], goal = 65100, reach = null, acc = 0;
  for (var j = 0; j <= 18; j++) {
    y2.push(j + '년'); save2.push(2400 * j);
    if (j > 0) acc = acc * 1.05 + 2400;
    inv2.push(Math.round(acc));
    if (reach === null && acc >= goal) reach = j;
  }
  if (reach === null) reach = 18;

  // 지금 모양 (계산기와 같은 설정)
  function oldChart(id, labels, base, main, baseLabel, mainLabel, goalLine) {
    var ds = [
      { label: '  ' + baseLabel, data: base, borderColor: '#b8a99a', borderWidth: 2, borderDash: [4, 4], pointRadius: 0, tension: 0, fill: false },
      { label: '  ' + mainLabel, data: main, borderColor: ORANGE, backgroundColor: 'rgba(255,107,0,.10)', borderWidth: 2.5, pointRadius: 2, tension: .2, fill: true }
    ];
    if (goalLine) ds.push({ label: '  목표', data: labels.map(function () { return goalLine; }), borderColor: '#197a54', borderWidth: 2, borderDash: [2, 3], pointRadius: 0, fill: false });
    new Chart(document.getElementById(id), {
      type: 'line', data: { labels: labels, datasets: ds },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: { legend: { position: 'bottom', align: 'start', reverse: true, labels: { usePointStyle: true, boxWidth: 8, padding: 18, font: { weight: 700 } } } },
        scales: {
          x: { grid: { display: false }, ticks: { maxRotation: 0, maxTicksLimit: 9, color: MUTED } },
          y: { position: 'right', beginAtZero: true, grid: { color: 'rgba(26,26,26,.08)' }, ticks: { callback: man, color: MUTED } }
        }
      }
    });
  }

  // 바꾼 안: 선 끝에 이름·금액을 직접 쓰는 플러그인
  var endLabels = {
    id: 'endLabels',
    afterDatasetsDraw: function (chart, args, opts) {
      var ctx = chart.ctx;
      (opts.items || []).forEach(function (it) {
        var meta = chart.getDatasetMeta(it.ds);
        var pt = meta.data[it.index != null ? it.index : meta.data.length - 1];
        if (!pt) return;
        ctx.save();
        if (it.dot) {
          ctx.fillStyle = '#fff'; ctx.strokeStyle = it.color; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        }
        ctx.fillStyle = it.color; ctx.textAlign = it.align || 'right';
        ctx.font = (it.big ? '800 16px' : '700 12px') + ' Pretendard, sans-serif';
        ctx.fillText(it.text, pt.x + (it.dx || 0), pt.y + (it.dy || -12));
        ctx.restore();
      });
    }
  };

  function newChart(id, labels, base, main, items, goalLine) {
    var ds = [
      { data: base, borderColor: SOFT, borderWidth: 1.5, pointRadius: 0, tension: 0, fill: false },
      { data: main, borderColor: ORANGE, borderWidth: 3.5, pointRadius: 0, pointHoverRadius: 5, tension: .25, fill: false }
    ];
    if (goalLine) ds.push({ data: labels.map(function () { return goalLine; }), borderColor: 'rgba(25,122,84,.45)', borderWidth: 1.5, pointRadius: 0, fill: false });
    new Chart(document.getElementById(id), {
      type: 'line', data: { labels: labels, datasets: ds }, plugins: [endLabels],
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        layout: { padding: { top: 26, right: 6, left: 4 } },
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { display: false }, tooltip: { enabled: true }, endLabels: { items: items } },
        scales: {
          x: { grid: { display: false }, border: { display: false }, ticks: { autoSkip: false, maxRotation: 0, color: MUTED, callback: function (v, i) { var n = labels.length - 1; return (i === 0 || i === n || i === Math.round(n / 2)) ? labels[i] : ''; } } },
          y: { position: 'right', beginAtZero: true, grace: '8%', border: { display: false }, grid: { color: 'rgba(26,26,26,.05)' }, ticks: { callback: man, color: MUTED, maxTicksLimit: 5 } }
        }
      }
    });
  }

  oldChart('c1old', y1, put1, grow1, '넣은 돈', '복리');
  newChart('c1new', y1, put1, grow1, [
    { ds: 1, text: man(grow1[10]) + '원', color: ORANGE, big: true, dot: true, dx: -10, dy: -14 },
    { ds: 0, text: '넣은 돈 1,000만원', color: MUTED, dx: -4, dy: 18 }
  ]);

  oldChart('c2old', y2, save2, inv2, '저축만 했을 때', '저축 + 투자', goal);
  newChart('c2new', y2, save2, inv2, [
    { ds: 1, index: reach, text: (35 + reach) + '세 목표 도달', color: ORANGE, big: true, dot: true, dx: -10, dy: -14 },
    { ds: 0, text: '저축만 했을 때', color: MUTED, dx: -4, dy: 18 },
    { ds: 2, index: 0, text: '목표 6.5억', color: '#197a54', align: 'left', dx: 2, dy: -8 }
  ], goal);
</script>
</body>
