<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>은퇴계산기 - 우리동네재테크</title>
  <meta name="description" content="현재 자산, 월저축, 은퇴 후 연지출, 투자수익률로 은퇴 가능 시점을 계산하는 한국형 은퇴계산기">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <link rel="stylesheet" href="fire-retirement-calculator.css?v=20260623r">
  <style>
    /* 끼워넣기(embed) 모드: 사이트 머리글·탭·뒤로가기 숨김 */
    html.embed .calc-tabs, html.embed .hero .back-link { display: none !important; }
    /* 끼워넣을 땐 좌우 여백 줄여 폭 넓힘 */
    html.embed .fire-page { padding-left: 8px; padding-right: 8px; max-width: 100%; }
  </style>
  <script>
    if (new URLSearchParams(location.search).get('embed') === '1') document.documentElement.classList.add('embed');
  </script>
</head>
<body>
  <main class="fire-page">
    <nav class="calc-tabs" aria-label="계산기 선택">
      <a href="fire-retirement-calculator.html" class="active" aria-current="page">은퇴계산기</a>
      <a href="compound-interest-calculator.html">복리계산기</a>
    </nav>
    <section class="hero">
      <a class="back-link" href="../index.html">← 도구 목록으로 돌아가기</a>
      <h1>은퇴계산기</h1>
      <p>언제 경제적 자유에 가까워지는지 계산합니다.</p>
      <p class="assumption-note">세금, 수수료, 물가상승률은 반영하지 않습니다.</p>
    </section>

    <section class="calculator" id="calculator">
      <form class="input-panel" id="inputForm">
        <section class="input-card">
          <h2><span class="step-num">1</span>현재 상황</h2>

          <label class="ly-field">
            <span>현재 나이</span>
            <div class="value-box">
              <input id="currentAge" type="number" min="10" max="99" step="1" value="35">
              <em>세</em>
            </div>
          </label>

          <label class="ly-field">
            <span>현재 보유자산</span>
            <div class="value-box">
              <input id="currentAssets" type="text" inputmode="decimal" value="0">
              <em>만원</em>
            </div>
          </label>

          <label class="ly-field">
            <span>연 저축액</span>
            <div class="value-box">
              <input id="annualSavings" type="text" inputmode="decimal" value="2,400">
              <em>만원</em>
            </div>
          </label>
        </section>

        <section class="input-card" id="planCard">
          <h2><span class="step-num">2</span>은퇴 계획</h2>

          <div class="mode-row">
            <div class="mode-toggle" role="group" aria-label="입력 방식">
              <button type="button" class="mode-btn active" data-emode="expense" aria-pressed="true">월지출</button>
              <button type="button" class="mode-btn" data-emode="target" aria-pressed="false">은퇴자금</button>
            </div>
            <button type="button" class="reset-icon" id="resetInputs" title="기본값으로 초기화" aria-label="초기화">↻</button>
          </div>

          <label class="ly-field emode-expense-only">
            <span>은퇴 후 월지출</span>
            <div class="value-box">
              <input id="monthlyExpenses" type="text" inputmode="decimal" value="217">
              <em>만원</em>
            </div>
          </label>

          <label class="ly-field emode-target-only">
            <span>목표 은퇴자금</span>
            <div class="value-box">
              <input id="targetInput" type="text" inputmode="decimal" value="65,100">
              <em>만원</em>
            </div>
          </label>

          <label class="ly-field slider-field">
            <span class="label-with-hint">연 수익률<details class="hint"><summary aria-label="수익률 설명 보기">i</summary><p>자산 전체(저축액 포함)가 1년에 불어나는 비율.</p></details></span>
            <strong id="returnInlinePreview">5%</strong>
            <input id="annualReturnRange" type="range" min="-5" max="15" step="0.1" value="5">
            <div class="value-box compact">
              <input id="annualReturn" type="number" min="-5" max="15" step="0.1" value="5">
              <em>%</em>
            </div>
          </label>
        </section>

      </form>

      <section class="result-strip" aria-live="polite">
        <article>
          <span>예상 은퇴</span>
          <strong id="retirementAge">-</strong>
          <p id="retirementSub">계산 중</p>
        </article>
        <article>
          <span>목표 은퇴자금</span>
          <strong id="fireTarget">0원</strong>
          <p id="targetSub">1년 생활비의 25배</p>
        </article>
        <article>
          <span>연간 저축액</span>
          <strong id="annualSavingsOut">0원</strong>
          <p id="savingRate">월 저축액 -</p>
        </article>
      </section>

      <section class="projection-shell">
        <div class="projection-card" id="projectionCard">
          <h2 id="chartTitle">예상 경로</h2>

          <div class="chart-tabs" role="tablist" aria-label="결과 보기 선택">
            <button type="button" class="active" data-projection-view="chart">차트</button>
            <button type="button" data-projection-view="table">표</button>
          </div>

          <div class="chart-wrap" id="chartView">
            <canvas id="projectionChart"></canvas>
          </div>

          <div class="chart-foot">
            <p id="insightCard"></p>
            <button type="button" class="secondary-button share-bottom" id="copyShareTop">공유</button>
          </div>

          <div class="table-panel" id="tablePanel">
            <div class="table-title">
              <div>
                <span>연도별 상세표</span>
                <strong>목표 은퇴자금에 도달하는 시점이 예상 은퇴 기준입니다. 투자수익/연지출은 참고 지표입니다. 단위: 만원</strong>
              </div>
              <button class="secondary-button table-toggle" type="button" id="toggleRows">전체 연도 보기</button>
            </div>

            <div class="table-wrap" id="tableView">
              <table>
                <thead>
                  <tr>
                    <th>연차</th>
                    <th>연저축</th>
                    <th>연지출</th>
                    <th>투자수익</th>
                    <th>투자수익/연지출</th>
                    <th>순자산 증가</th>
                    <th>순자산</th>
                  </tr>
                </thead>
                <tbody id="projectionTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="fire-retirement-calculator.js?v=20260623k"></script>
  <script>
    (function () {
      var embed = new URLSearchParams(location.search).get('embed') === '1';
      if (!embed) {
        // 단독 페이지: 사이트 머리글/꼬리글(shell) 로드
        var s = document.createElement('script');
        s.src = 'homepage-shell.js?v=20260506d';
        document.body.appendChild(s);
        return;
      }
      // 끼워넣기 모드: shell 미로드 + 부모 창에 높이 전달(칼럼 iframe 높이 자동맞춤)
      var postH = function () { parent.postMessage({ type: 'calc-height', h: document.body.scrollHeight }, '*'); };
      window.addEventListener('load', postH);
      window.addEventListener('resize', postH);
      if (window.ResizeObserver) new ResizeObserver(postH).observe(document.body);
      setInterval(postH, 1000);
    })();
  </script>
</body>
</html>
