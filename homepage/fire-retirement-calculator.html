<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>은퇴계산기 - 우리동네재테크</title>
  <meta name="description" content="현재 자산, 월저축, 은퇴 후 연지출, 투자수익률로 은퇴 가능 시점을 계산하는 한국형 은퇴계산기">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/AceDev-Labs/GmarketSans/GmarketSans.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <link rel="stylesheet" href="fire-retirement-calculator.css?v=20260623n">
</head>
<body>
  <main class="fire-page">
    <nav class="calc-tabs" aria-label="계산기 선택">
      <a href="fire-retirement-calculator.html" class="active" aria-current="page">은퇴계산기</a>
      <a href="compound-interest-calculator.html">복리계산기</a>
    </nav>
    <section class="hero">
      <a class="back-link" href="../index.html">← 도구 목록으로 돌아가기</a>
      <h1>은퇴계산기</h1>
      <p>언제 경제적 독립에 가까워지는지 계산합니다.</p>
      <p class="assumption-note">세금, 수수료, 물가상승률은 반영하지 않습니다.</p>
    </section>

    <section class="calculator" id="calculator">
      <form class="input-panel" id="inputForm">
        <section class="input-card">
          <h2><span class="step-num">1</span>현재 상황</h2>

          <label class="ly-field">
            <span>현재 나이</span>
            <div class="value-box">
              <input id="currentAge" type="number" min="10" max="99" step="1" value="35">
              <em>세</em>
            </div>
          </label>

          <label class="ly-field">
            <span>현재 보유자산</span>
            <div class="value-box">
              <input id="currentAssets" type="text" inputmode="decimal" value="0">
              <em>만원</em>
            </div>
          </label>

          <label class="ly-field">
            <span>연 저축액</span>
            <div class="value-box">
              <input id="annualSavings" type="text" inputmode="decimal" value="2,400">
              <em>만원</em>
            </div>
          </label>
        </section>

        <section class="input-card">
          <h2><span class="step-num">2</span>은퇴 계획</h2>

          <label class="ly-field">
            <span>은퇴 후 월지출</span>
            <div class="value-box">
              <input id="monthlyExpenses" type="text" inputmode="decimal" value="217">
              <em>만원</em>
            </div>
          </label>

          <label class="ly-field slider-field">
            <span class="label-with-hint">연 수익률<details class="hint"><summary aria-label="수익률 설명 보기">i</summary><p>자산 전체(저축액 포함)가 1년에 불어나는 비율.</p></details></span>
            <strong id="returnInlinePreview">5%</strong>
            <input id="annualReturnRange" type="range" min="-5" max="15" step="0.1" value="5">
            <div class="value-box compact">
              <input id="annualReturn" type="number" min="-5" max="15" step="0.1" value="5">
              <em>%</em>
            </div>
          </label>
        </section>

        <div class="button-row">
          <button type="button" class="secondary-button" id="resetInputs">초기화</button>
          <button type="button" class="primary-button" id="copyShare">링크 공유</button>
        </div>
      </form>

      <section class="result-strip" aria-live="polite">
        <article>
          <span>예상 은퇴</span>
          <strong id="retirementAge">-</strong>
          <p id="retirementSub">계산 중</p>
        </article>
        <article>
          <span>목표 은퇴자금</span>
          <strong id="fireTarget">0원</strong>
          <p id="targetSub">1년 생활비의 25배</p>
        </article>
        <article>
          <span>연간 저축액</span>
          <strong id="annualSavingsOut">0원</strong>
          <p id="savingRate">월 저축액 -</p>
        </article>
      </section>

      <section class="projection-shell">
        <div class="projection-card" id="projectionCard">
          <h2 id="chartTitle">예상 경로</h2>

          <div class="chart-tabs" role="tablist" aria-label="결과 보기 선택">
            <button type="button" class="active" data-projection-view="chart">차트</button>
            <button type="button" data-projection-view="table">표</button>
          </div>

          <div class="chart-wrap" id="chartView">
            <canvas id="projectionChart"></canvas>
          </div>

          <div class="chart-foot">
            <p id="insightCard"></p>
            <button type="button" class="secondary-button share-bottom" id="copyShareTop">공유</button>
          </div>

          <div class="table-panel" id="tablePanel">
            <div class="table-title">
              <div>
                <span>연도별 상세표</span>
                <strong>목표 은퇴자금에 도달하는 시점이 예상 은퇴 기준입니다. 투자수익/연지출은 참고 지표입니다. 단위: 만원</strong>
              </div>
              <button class="secondary-button table-toggle" type="button" id="toggleRows">전체 연도 보기</button>
            </div>

            <div class="table-wrap" id="tableView">
              <table>
                <thead>
                  <tr>
                    <th>연차</th>
                    <th>연저축</th>
                    <th>연지출</th>
                    <th>투자수익</th>
                    <th>투자수익/연지출</th>
                    <th>순자산 증가</th>
                    <th>순자산</th>
                  </tr>
                </thead>
                <tbody id="projectionTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="fire-retirement-calculator.js?v=20260623g"></script>
  <script src="homepage-shell.js?v=20260506d"></script>
</body>
</html>
