<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>결제 안내 다시 보기 시안 - 우리동네재테크</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
<style>
  body { font-family: Pretendard, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .word-keep { word-break: keep-all; overflow-wrap: break-word; }
</style>
</head>
<body class="bg-[#f5f0e8] text-[#111]">
  <main class="mx-auto max-w-3xl px-5 py-10">
    <section class="rounded-3xl bg-white p-7 shadow-xl sm:p-10">
      <p class="text-sm font-black text-[#ff6b00]">코칭 신청</p>
      <h1 class="mt-2 text-3xl font-black tracking-tight">신청서 영역 예시</h1>
      <div class="mt-8 space-y-5">
        <div>
          <label class="block text-sm font-bold">성함</label>
          <div class="mt-2 h-12 rounded-xl border border-gray-200 bg-gray-50"></div>
        </div>
        <div>
          <label class="block text-sm font-bold">휴대폰 번호</label>
          <div class="mt-2 h-12 rounded-xl border border-gray-200 bg-gray-50"></div>
        </div>
        <button class="h-14 w-full rounded-2xl bg-[#ff6b00] font-black text-white">코칭 대기신청</button>
      </div>
    </section>

    <section class="mt-5 rounded-3xl border-2 border-[#ff6b00] bg-white p-6 shadow-[0_14px_36px_rgba(255,107,0,.12)] sm:p-7">
      <div class="flex flex-col gap-4 sm:flex-row sm:items-start sm:justify-between">
        <div>
          <p class="inline-flex rounded-full bg-orange-50 px-3 py-1 text-xs font-black text-[#ff6b00]">신청 접수 완료</p>
          <h2 class="mt-3 text-2xl font-black tracking-tight word-keep">결제 안내 다시 보기</h2>
          <p class="mt-2 text-sm leading-6 text-gray-600 word-keep">팝업을 닫아도 아래 정보로 결제를 진행할 수 있습니다.</p>
        </div>
        <a href="https://lst9485-alt.github.io/cdn-assets/homepage/coaching-payment-guide-v3.html" class="inline-flex shrink-0 items-center justify-center rounded-2xl bg-[#ff6b00] px-5 py-3 text-sm font-black text-white">결제 안내 페이지 열기</a>
      </div>

      <div class="mt-6 grid gap-3 sm:grid-cols-2">
        <div class="rounded-2xl bg-orange-50 p-5">
          <p class="text-xs font-bold text-gray-500">입금 금액</p>
          <p class="mt-1 text-3xl font-black text-[#ff6b00]">400,000원</p>
        </div>
        <div class="rounded-2xl bg-gray-50 p-5">
          <p class="text-xs font-bold text-gray-500">입금 계좌</p>
          <p class="mt-1 text-xl font-black tracking-tight">하나은행 125-910032-26304</p>
          <p class="mt-1 text-xs text-gray-500">예금주 · 주식회사 우리동네사람들</p>
        </div>
      </div>

      <button type="button" data-copy="하나은행 125-910032-26304" class="mt-4 h-12 w-full rounded-2xl border border-gray-200 bg-white text-sm font-black text-gray-800">계좌번호 복사</button>
      <p class="mt-4 text-center text-xs leading-5 text-gray-500 word-keep">입금자명은 신청자명과 동일하게 보내주세요. 결제 확인 후 카카오톡으로 사전질문지를 보내드립니다.</p>
    </section>
  </main>

  <div id="copyToast" class="pointer-events-none fixed left-1/2 top-5 hidden -translate-x-1/2 rounded-full bg-gray-950 px-5 py-3 text-sm font-bold text-white shadow-xl">계좌번호를 복사했습니다</div>
  <script>
    document.querySelector('[data-copy]').addEventListener('click', function(e) {
      navigator.clipboard.writeText(e.currentTarget.getAttribute('data-copy')).then(function() {
        var toast = document.getElementById('copyToast');
        toast.classList.remove('hidden');
        setTimeout(function() { toast.classList.add('hidden'); }, 1500);
      });
    });
  </script>
</body>
</html>
